<!doctype html>
<html lang="en" data-theme="graphite">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="QR Studio: create styled QR codes for links, Wi-Fi, contacts, events and more – with gradients, logos and frames – and decode QR codes from images or the camera, all in the browser."
    />
    <title>QR Studio · ToolVault</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../shared/tv.css" />
    <link rel="stylesheet" href="qr.css" />
    <script src="../shared/tv.js"></script>
    <script src="../shared/vendor/qrcode-generator.js"></script>
    <script src="../shared/vendor/jsQR.js"></script>
  </head>

  <body>
    <div class="wrap">
      <header class="topbar">
        <a class="wordmark" href="../index.html"
          ><span class="prompt">~/</span><span class="hub">ToolVault</span
          ><span class="prompt">/</span><span class="tool">qr</span></a
        >
        <div class="topbar-right">
          <div class="themes" id="themes" role="group" aria-label="Theme"></div>
          <div class="lang" id="lang" role="group" aria-label="Language">
            <button data-lang="de">DE</button><span class="divider" aria-hidden="true">·</span
            ><button data-lang="en">EN</button>
          </div>
        </div>
      </header>

      <section class="hero">
        <p class="kicker" data-i18n="kicker"></p>
        <h1 data-i18n-html="title"></h1>
        <p data-i18n="lead"></p>
      </section>

      <div class="seg" role="tablist" id="modeTabs" style="margin-bottom: 14px">
        <button role="tab" data-mode="create" aria-selected="true" data-i18n="m_create"></button>
        <button role="tab" data-mode="read" aria-selected="false" data-i18n="m_read"></button>
      </div>

      <!-- ===================== Erstellen ===================== -->
      <section id="view-create" class="studio">
        <div class="stack">
          <div class="box">
            <h2 class="box-title"><span data-i18n="content"></span></h2>
            <div class="types" id="typeTabs" role="tablist"></div>
            <div class="form-grid" id="fields"></div>
          </div>

          <div class="box">
            <h2 class="box-title"><span data-i18n="design"></span><button class="btn sm" id="resetStyle" data-i18n="reset"></button></h2>

            <div class="design-sec">
              <h3 data-i18n="d_colors"></h3>
              <div class="opt-row">
                <span data-i18n="fg"></span>
                <span class="color-pair">
                  <input type="color" id="fg" /><input type="text" id="fgHex" spellcheck="false" />
                  <span class="seg small" id="fillSeg">
                    <button data-fill="solid" data-i18n="f_solid"></button>
                    <button data-fill="linear" data-i18n="f_linear"></button>
                    <button data-fill="radial" data-i18n="f_radial"></button>
                  </span>
                </span>
                <span></span>
              </div>
              <div class="opt-row" id="fg2Row">
                <span data-i18n="fg2"></span>
                <span class="color-pair"><input type="color" id="fg2" /><input type="text" id="fg2Hex" spellcheck="false" /></span>
                <span></span>
              </div>
              <div class="opt-row">
                <span data-i18n="bg"></span>
                <span class="color-pair"
                  ><input type="color" id="bg" /><input type="text" id="bgHex" spellcheck="false" />
                  <label class="check"><input type="checkbox" id="transparent" /> <span data-i18n="transparent"></span></label
                ></span>
                <span></span>
              </div>
              <div class="opt-row">
                <span data-i18n="eyeColor"></span>
                <span class="color-pair"
                  ><label class="check"><input type="checkbox" id="eyeOwn" /> <span data-i18n="own"></span></label>
                  <input type="color" id="eye" /><input type="text" id="eyeHex" spellcheck="false"
                /></span>
                <span></span>
              </div>
              <div class="row" style="margin-top: 12px; gap: 6px" id="presets"></div>
            </div>

            <div class="design-sec">
              <h3 data-i18n="d_shape"></h3>
              <div class="opt-row">
                <span data-i18n="modules"></span>
                <span class="seg small" id="shapeSeg"></span>
                <span></span>
              </div>
              <div class="opt-row">
                <span data-i18n="eyes"></span>
                <span class="seg small" id="eyeSeg"></span>
                <span></span>
              </div>
              <div class="opt-row">
                <span data-i18n="corners"></span>
                <input type="range" id="radius" min="0" max="12" value="0" />
                <span class="val" id="radiusVal">0</span>
              </div>
            </div>

            <div class="design-sec">
              <h3 data-i18n="d_logo"></h3>
              <div class="logos" id="logos"></div>
              <div class="opt-row" style="margin-top: 12px" id="logoSizeRow">
                <span data-i18n="logoSize"></span>
                <input type="range" id="logoSize" min="12" max="28" value="22" />
                <span class="val" id="logoSizeVal">22%</span>
              </div>
              <div class="opt-row" id="logoColorRow">
                <span data-i18n="logoColor"></span>
                <span class="color-pair"><input type="color" id="logoColor" /><input type="text" id="logoColorHex" spellcheck="false" /></span>
                <span></span>
              </div>
              <p class="msg" id="logoNote" style="font-size: 0.74rem"></p>
            </div>

            <div class="design-sec">
              <h3 data-i18n="d_frame"></h3>
              <div class="opt-row">
                <span data-i18n="frame"></span>
                <span class="seg small" id="frameSeg">
                  <button data-frame="none" data-i18n="fr_none"></button>
                  <button data-frame="label" data-i18n="fr_label"></button>
                  <button data-frame="badge" data-i18n="fr_badge"></button>
                </span>
                <span></span>
              </div>
              <div class="opt-row" id="captionRow">
                <span data-i18n="caption"></span>
                <input type="text" id="caption" maxlength="28" spellcheck="false" />
                <span></span>
              </div>
            </div>

            <div class="design-sec">
              <h3 data-i18n="d_tech"></h3>
              <div class="opt-row">
                <span data-i18n="ecc"></span>
                <span class="seg small" id="eccSeg">
                  <button data-ecc="L">L 7%</button>
                  <button data-ecc="M">M 15%</button>
                  <button data-ecc="Q">Q 25%</button>
                  <button data-ecc="H">H 30%</button>
                </span>
                <span></span>
              </div>
              <div class="opt-row">
                <span data-i18n="margin"></span>
                <input type="range" id="margin" min="0" max="8" value="4" />
                <span class="val" id="marginVal">4</span>
              </div>
              <div class="opt-row">
                <span data-i18n="size"></span>
                <input type="range" id="size" min="128" max="2048" step="64" value="1024" />
                <span class="val" id="sizeVal">1024 px</span>
              </div>
            </div>
          </div>
        </div>

        <div class="box preview-box">
          <h2 class="box-title"><span data-i18n="preview"></span><span class="pill" id="qrInfo"></span></h2>
          <div class="qr-stage"><canvas id="qrCanvas" width="600" height="600" aria-label="QR code"></canvas></div>
          <div class="verify" id="verify"></div>
          <div class="row" style="margin-top: 12px">
            <button class="btn primary" id="dlPng">⬇ PNG</button>
            <button class="btn" id="dlSvg">⬇ SVG</button>
            <button class="btn" id="copyPng" data-i18n="copyImg"></button>
          </div>
          <p class="msg" id="genMsg"></p>
          <div class="details" id="details"></div>
        </div>
      </section>

      <!-- ===================== Lesen ===================== -->
      <section id="view-read" hidden>
        <div class="cols">
          <label class="drop" id="drop">
            <span id="dropIco"></span>
            <span data-i18n="dropText"></span>
            <span class="hint" data-i18n="dropHint"></span>
            <input type="file" id="readFile" accept="image/*" />
          </label>
          <button class="drop" id="camBtn" type="button">
            <span id="camIco"></span>
            <span data-i18n="camText"></span>
            <span class="hint" data-i18n="camHint"></span>
          </button>
        </div>
        <div class="cam" id="cam" hidden>
          <video id="video" playsinline muted></video>
          <div class="reticle"></div>
          <button class="btn sm close" id="camClose" data-i18n="close"></button>
        </div>
        <p class="msg" id="readMsg"></p>

        <div class="box" id="readResult" hidden style="margin-top: 14px">
          <div class="read-grid">
            <div>
              <div class="shot"><canvas id="shot"></canvas></div>
              <p class="mono muted" style="font-size: 0.7rem; margin: 6px 0 0; word-break: break-all" id="srcName"></p>
            </div>
            <div>
              <div class="read-head">
                <span class="read-ico" id="typeIco"></span>
                <div>
                  <div class="mono muted" style="font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em" data-i18n="detected"></div>
                  <h3 id="typeName"></h3>
                </div>
              </div>
              <div class="payload" id="payload"></div>
              <div class="row" id="actions" style="margin-top: 12px"></div>
              <div class="fields" id="parsed"></div>
            </div>
          </div>
          <div class="stats" id="readStats" style="margin-top: 16px"></div>
          <details class="adv" style="margin-top: 14px">
            <summary data-i18n="advanced"></summary>
            <div class="kv" id="tech" style="margin-top: 10px"></div>
            <pre class="hexdump" id="hex" style="margin-top: 10px"></pre>
          </details>
          <div class="row" style="margin-top: 14px">
            <button class="btn sm" id="toCreate" data-i18n="toCreate"></button>
          </div>
        </div>
      </section>

      <footer class="footer">
        <a href="../index.html">← ToolVault</a><span>·</span><span>QR Studio v2.1</span><span>·</span
        ><span data-i18n="local"></span><span>·</span><span id="tv-year"></span>
      </footer>
    </div>

    <canvas id="work" hidden></canvas>

    <script src="qr-strings.js"></script>
    <script src="qr.js"></script>
  </body>
</html>
