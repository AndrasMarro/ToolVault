<!doctype html>
<html lang="en" data-theme="black">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Generate strong random passwords, pronounceable passphrases and PINs with the Web Crypto API — nothing is sent or stored."
    />
    <title>Password Generator · ToolVault</title>

    <style>
      .result {
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px 18px;
        min-height: 74px;
      }
      .result .pw {
        flex: 1;
        font-family: var(--mono);
        font-size: clamp(1.05rem, 2.6vw, 1.45rem);
        font-weight: 500;
        word-break: break-all;
        line-height: 1.35;
        user-select: all;
      }
      .pw .d {
        color: #7fb4ff;
      }
      .pw .s {
        color: var(--accent);
      }
      [data-theme='paper'] .pw .d {
        color: #2456b8;
      }
      .meter {
        height: 6px;
        border-radius: 4px;
        background: var(--surface-2);
        overflow: hidden;
        margin-top: 14px;
      }
      .meter span {
        display: block;
        height: 100%;
        width: 0;
        border-radius: 4px;
        transition:
          width 0.25s ease,
          background 0.25s ease;
      }
      .meter-info {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        font-family: var(--mono);
        font-size: 0.78rem;
        color: var(--text-muted);
        margin-top: 8px;
      }
      .opt-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
        gap: 10px 18px;
      }
      .len-row {
        display: grid;
        grid-template-columns: auto 1fr 4.2em;
        gap: 12px;
        align-items: center;
        margin-bottom: 16px;
        font-family: var(--mono);
        font-size: 0.85rem;
      }
      .len-row input[type='number'] {
        padding: 6px 8px;
        text-align: center;
      }
      .bulk {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 6px;
      }
      .bulk li {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 7px 10px;
        font-family: var(--mono);
        font-size: 0.86rem;
        word-break: break-all;
      }
      .bulk li span {
        flex: 1;
      }
      .warns {
        margin: 10px 0 0;
        padding-left: 18px;
        font-size: 0.84rem;
        color: var(--text-muted);
      }
      .warns li::marker {
        color: var(--warn);
      }
      .note {
        font-size: 0.8rem;
        color: var(--text-muted);
        margin-top: 12px;
      }
    </style>

          checkPhPin: 'Type a PIN – stays local',
          checkPhPhrase: 'Type a passphrase, e.g. table-cloud-fork-moon',

          w_phraseFew: 'Fewer than 4 words – use at least 4, ideally 5–6 random words.',
          w_phraseShortWords: 'Very short words – use longer, random words.',
          w_phraseSentence: 'Sounds like a sentence or quote – random words are safer.',
          w_phraseRepeat: 'A word appears more than once.',
          pinChance: (n) => `Chance of guessing in 3 tries: 1 in ${n}`,
          pinTopChance: 'Chance of guessing in 3 tries: high (common PIN)',
          pinOk: 'fine for a bank or SIM card (with lockout)',
          pinPhone: 'good for a phone',
          pinWeak: 'easy to guess',
          pinBest: 'very good',
          checkNotePin: 'A PIN is only safe together with a lockout after a few wrong attempts. The rating shows how easy it is to guess.',
          checkNotePhrase: 'Assumes words picked at random from a large word list (~7776 words, like Diceware). Self-made sentences are much weaker.',
          w_repeat: 'Repeated characters (e.g. “aaa”).',
          w_seq: 'Sequences like “abc” or “123”.',
          w_common: 'Contains a very common password pattern.',
          w_year: 'Contains a year.',
          w_onlyClass: 'Only one character class.',
          units: { s: 'sec', m: 'min', h: 'hours', d: 'days', y: 'years', inst: 'instantly', forever: 'ages' },
          local: 'runs locally in your browser',
        },
      };

      const { $, $$, t, esc, copy } = TV;

      // #region Zufall — gleichverteilt per Rejection Sampling
      function randInt(max) {
        if (max <= 0) return 0;
        const limit = Math.floor(0x100000000 / max) * max;
        const buf = new Uint32Array(1);
        let x;
        do {
          crypto.getRandomValues(buf);
          x = buf[0];
        } while (x >= limit);
        return x % max;
      }
      const pick = (str) => str[randInt(str.length)];
      function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = randInt(i + 1);
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }
      // #endregion

      // #region Generatoren
      const SETS = {
        lower: 'abcdefghijklmnopqrstuvwxyz',
        upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
        digits: '0123456789',
        symbols: '!@#$%^&*()-_=+[]{};:,.<>/?~',
      };
      const AMBIG = 'Il1O0o|`\'"';
      const CONS = 'bdfghjklmnprstvz'; // 16
      const VOW = 'aeiou';

      let mode = 'password';
      let count = 1;

      function activeSets() {
        const ex = new Set(($('#exclude').value + ($('#ambig').checked ? AMBIG : '')).split(''));
        return Object.keys(SETS)
          .filter((k) => $('#' + k).checked)
          .map((k) => [...SETS[k]].filter((c) => !ex.has(c)).join(''))
          .filter(Boolean);
      }

      function genPassword(len) {
        const sets = activeSets();
        if (!sets.length) return null;
        const pool = sets.join('');
        const chars = [];
        if ($('#each').checked && len >= sets.length) sets.forEach((s) => chars.push(pick(s)));
        while (chars.length < len) chars.push(pick(pool));
        return shuffle(chars).join('');
      }

      // Aussprechbares Wort: K V K V K -> 16·5·16·5·16 Kombinationen
      const word = () => pick(CONS) + pick(VOW) + pick(CONS) + pick(VOW) + pick(CONS);
      function genPhrase(n) {
        const sep = $('#sep').value;
        const cap = $('#cap').checked;
        const words = Array.from({ length: n }, () => {
          const w = word();
          return cap ? w[0].toUpperCase() + w.slice(1) : w;
        });
        if ($('#addNum').checked) words.push(String(randInt(100)).padStart(2, '0'));
        return words.join(sep);
      }

      function genPin(n) {
        return Array.from({ length: n }, () => pick(SETS.digits)).join('');
      }

      // Entropie des Generators (nicht des Ergebnisses) in Bit
      function genEntropy(len) {
        if (mode === 'pin') return len * Math.log2(10);
        if (mode === 'phrase') {
          const perWord = Math.log2(CONS.length ** 3 * VOW.length ** 2);
          return len * perWord + ($('#addNum').checked ? Math.log2(100) : 0);
        }
        const pool = activeSets().join('').length;
        return pool ? len * Math.log2(pool) : 0;
      }
      // #endregion

      // #region Anzeige
      function crackTime(bits) {
        const u = t('units');
        // Durchschnitt: halber Suchraum
        const secs = 2 ** (bits - 1) / 1e10;
        if (secs < 1) return u.inst;
        const steps = [
          [60, 's', 1],
          [3600, 'm', 60],
          [86400, 'h', 3600],
          [31557600, 'd', 86400],
        ];
        for (const [lim, k, div] of steps) if (secs < lim) return Math.round(secs / div) + ' ' + u[k];
        const y = secs / 31557600;
        if (y > 1e15) return u.forever;
        if (y >= 1e6) return y.toExponential(1).replace('e+', '·10^') + ' ' + u.y;
        return Math.round(y).toLocaleString() + ' ' + u.y;
      }
      function level(bits) {
        return bits < 28 ? 0 : bits < 45 ? 1 : bits < 60 ? 2 : bits < 90 ? 3 : 4;
      }
      const LEVEL_COLORS = ['var(--bad)', 'var(--bad)', 'var(--warn)', 'var(--ok)', 'var(--ok)'];
      function showMeter(bits, ids) {
        const lv = level(bits);
        const bar = $(ids.bar);
        bar.style.width = Math.min(100, (bits / 128) * 100) + '%';
        bar.style.background = LEVEL_COLORS[lv];
        $(ids.strength).textContent = bits ? t('s' + lv) : '';
        $(ids.strength).style.color = bits ? LEVEL_COLORS[lv] : '';
        $(ids.entropy).textContent = bits ? t('bits', Math.round(bits)) : '';
        $(ids.crack).textContent = bits ? t('crack', crackTime(bits)) : '';
      }

      const colorize = (pw) =>
        [...pw]
          .map((c) => (/\d/.test(c) ? `<span class="d">${esc(c)}</span>` : /[a-z]/i.test(c) ? esc(c) : `<span class="s">${esc(c)}</span>`))
          .join('');

      let current = '';
      let bulkList = [];
      function generate() {
        const len = Number($('#lenNum').value);
        const gen = mode === 'password' ? genPassword : mode === 'phrase' ? genPhrase : genPin;
        current = gen(len);
        if (current === null) {
          $('#pw').innerHTML = `<span class="muted" style="font-size:0.9rem">${esc(t('noSet'))}</span>`;
          showMeter(0, METER);
          $('#bulk').innerHTML = '';
          return;
        }
        $('#pw').innerHTML = colorize(current);
        showMeter(genEntropy(len), METER);

        bulkList = count > 1 ? Array.from({ length: count }, () => gen(len)) : [];
        $('#copyAll').hidden = count === 1;
        $('#bulk').innerHTML = '';
        bulkList.forEach((p) => {
          const li = document.createElement('li');
          li.innerHTML = `<span>${colorize(p)}</span>`;
          const b = document.createElement('button');
          b.className = 'btn sm';
          b.textContent = t('copy');
          b.addEventListener('click', () => copy(p));
          li.appendChild(b);
          $('#bulk').appendChild(li);
        });
      }
      const METER = { bar: '#meterBar', strength: '#strength', entropy: '#entropy', crack: '#crack' };
      // #endregion

      // #region Modus + Längen-Grenzen
      const LIMITS = {
        password: { min: 4, max: 128, slider: 64, def: 20, label: 'length' },
        phrase: { min: 2, max: 12, slider: 12, def: 5, label: 'words' },
        pin: { min: 4, max: 16, slider: 16, def: 6, label: 'digitsLabel' },
      };
      const lenVals = { password: 20, phrase: 5, pin: 6 };

      function setMode(m) {
        mode = m;
        const L = LIMITS[m];
        $$('[data-mode]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.mode === m)));
        $$('[data-for]').forEach((el) => (el.hidden = el.dataset.for !== m));
        $('#len').min = L.min;
        $('#len').max = L.slider;
        $('#lenNum').min = L.min;
        $('#lenNum').max = L.max;
        $('#lenNum').value = lenVals[m];
        $('#len').value = Math.min(lenVals[m], L.slider);
        $('#lenLabel').dataset.i18n = L.label;
        $('#lenLabel').textContent = t(L.label);
        generate();
      }

      $$('[data-mode]').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));
      $('#len').addEventListener('input', () => {
        $('#lenNum').value = $('#len').value;
        lenVals[mode] = +$('#len').value;
        generate();
      });
      $('#lenNum').addEventListener('change', () => {
        const L = LIMITS[mode];
        const v = Math.min(L.max, Math.max(L.min, Math.round(+$('#lenNum').value || L.def)));
        $('#lenNum').value = v;
        $('#len').value = Math.min(v, L.slider);
        lenVals[mode] = v;
        generate();
      });
      ['lower', 'upper', 'digits', 'symbols', 'ambig', 'each', 'cap', 'addNum'].forEach((id) =>
        $('#' + id).addEventListener('change', generate),
      );
      ['exclude'].forEach((id) => $('#' + id).addEventListener('input', generate));
      $('#sep').addEventListener('change', generate);
      $$('#bulkSeg button').forEach((b) =>
        b.addEventListener('click', () => {
          count = +b.dataset.n;
          $$('#bulkSeg button').forEach((x) => x.setAttribute('aria-selected', String(x === b)));
          generate();
        }),
      );
      $('#regen').addEventListener('click', generate);
      $('#copy').addEventListener('click', () => current && copy(current));
      $('#copyAll').addEventListener('click', () => bulkList.length && copy(bulkList.join('\n'), bulkList.length + '×'));
      // Leertaste = neu erzeugen (ausser beim Tippen)
      document.addEventListener('keydown', (e) => {
        const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && document.activeElement.type !== 'checkbox' && document.activeElement.type !== 'range';
        if (e.code === 'Space' && !typing && document.activeElement.tagName !== 'BUTTON') {
          e.preventDefault();
          generate();
        }
      });
      // #endregion

      // #region Prüfer
      const COMMON = ['password', 'passwort', 'qwert', 'asdf', 'letmein', 'welcome', 'admin', 'iloveyou', 'monkey', 'dragon', 'master', 'sunshine', 'hallo', 'login', 'abc123', '123456', '111111', 'football', 'baseball', 'trustno1', 'shadow', 'michael', 'secret', 'geheim', 'schatz'];

      function checkPassword(pw) {
        const warns = [];
        if (!pw) return { bits: 0, warns };
        let pool = 0;
        const classes = [/[a-z]/, /[A-Z]/, /\d/, /[^a-zA-Z\d]/].filter((r) => r.test(pw));
        if (/[a-z]/.test(pw)) pool += 26;
        if (/[A-Z]/.test(pw)) pool += 26;
        if (/\d/.test(pw)) pool += 10;
        if (/[^a-zA-Z\d]/.test(pw)) pool += 33;
        let bits = pw.length * Math.log2(pool);
        const lower = pw.toLowerCase();

        if (pw.length < 12) warns.push('w_short');
        if (classes.length === 1) warns.push('w_onlyClass');
        if (/(.)\1\1/.test(pw)) {
          warns.push('w_repeat');
          bits *= 0.75;
        }
        let seq = 0;
        for (let i = 2; i < lower.length; i++) {
          const a = lower.charCodeAt(i - 2),
            b = lower.charCodeAt(i - 1),
            c = lower.charCodeAt(i);
          if ((b - a === 1 && c - b === 1) || (a - b === 1 && b - c === 1)) seq++;
        }
        if (seq) {
          warns.push('w_seq');
          bits -= seq * 4;
        }
        if (COMMON.some((w) => lower.includes(w))) {
          warns.push('w_common');
          bits *= 0.4;
        }
        if (/(19|20)\d\d/.test(pw)) {
          warns.push('w_year');
          bits -= 6;
        }
        return { bits: Math.max(1, bits), warns };
      }

      // PIN: realistisch ist nicht die Knackzeit, sondern die Chance, sie mit wenigen
      // Versuchen zu erraten (Sperre nach 3 Fehlversuchen)
      const TOP_PINS = ['1234', '1111', '0000', '1212', '7777', '1004', '2000', '4444', '2222', '6969', '9999', '3333', '5555', '6666', '1122', '1313', '8888', '4321', '2001', '1010', '123456', '000000', '111111', '654321', '121212', '112233', '666666', '123123', '159753', '147258'];
      const KEYPAD = ['2580', '0852', '1470', '0741', '3690', '0963', '1590', '7530', '3570', '9510', '1478', '3698', '1793', '7913', '8520', '147258', '258369', '963852'];
      function checkPin(pin) {
        const warns = [];
        if (!pin) return { bits: 0, warns };
        if (/\D/.test(pin)) warns.push('w_pinDigits');
        const d = pin.replace(/\D/g, '');
        if (!d) return { bits: 1, warns };
        let bits = d.length * Math.log2(10);
        let top = false;
        if (d.length < 6) warns.push('w_pinShort');
        if (TOP_PINS.includes(d)) {
          warns.push('w_pinTop');
          top = true;
          bits = Math.min(bits, 3);
        }
        if (/(\d)\1\1/.test(d) || new Set(d).size <= Math.ceil(d.length / 3)) {
          warns.push('w_pinRepeat');
          bits *= 0.5;
        }
        const asc = '01234567890',
          desc = '09876543210';
        for (let len = Math.min(d.length, 4); len >= 3; len--)
          for (let i = 0; i + len <= d.length; i++) {
            const part = d.slice(i, i + len);
            if (asc.includes(part) || desc.includes(part)) {
              if (!warns.includes('w_pinSeq')) {
                warns.push('w_pinSeq');
                bits -= 4;
              }
            }
          }
        if (/(19[3-9]\d|20[0-3]\d)/.test(d) && d.length <= 8) {
          warns.push('w_pinYear');
          bits -= 4;
        }
        if (d.length === 4) {
          const a = +d.slice(0, 2),
            b = +d.slice(2);
          if ((a >= 1 && a <= 31 && b >= 1 && b <= 12) || (a >= 1 && a <= 12 && b >= 1 && b <= 31)) {
            warns.push('w_pinDate');
            bits -= 2;
          }
        }
        if (KEYPAD.some((k) => d.includes(k))) {
          warns.push('w_pinKeypad');
          bits -= 4;
        }
        if (d.length >= 4 && /^(\d\d)\1+$/.test(d)) {
          warns.push('w_pinPair');
          bits -= 4;
        }
        return { bits: Math.max(1, bits), warns, top, digits: d.length };
      }

      // Passphrase: Entropie über die Wortanzahl (Diceware-Annahme), aber nie mehr
      // als die Zeichen-Schätzung hergibt
      function checkPhrase(ph) {
        const warns = [];
        if (!ph) return { bits: 0, warns };
        const words = ph.split(/[\s\-_.,;:+|/]+/).filter(Boolean);
        const lw = words.map((w) => w.toLowerCase());
        let bits = words.length * Math.log2(7776);
        if (/\d/.test(ph)) bits += 3;
        if (words.length < 4) warns.push('w_phraseFew');
        const avg = words.reduce((a, w) => a + w.length, 0) / Math.max(1, words.length);
        if (avg < 4) {
          warns.push('w_phraseShortWords');
          bits *= 0.6;
        }
        if (new Set(lw).size < lw.length) {
          warns.push('w_phraseRepeat');
          bits *= 0.6;
        }
        const glue = ['the', 'a', 'and', 'of', 'to', 'is', 'in', 'my', 'der', 'die', 'das', 'und', 'ist', 'ein', 'eine', 'ich', 'mein', 'meine'];
        if (lw.filter((w) => glue.includes(w)).length >= 2) {
          warns.push('w_phraseSentence');
          bits *= 0.5;
        }
        if (COMMON.some((w) => ph.toLowerCase().includes(w))) {
          warns.push('w_common');
          bits *= 0.5;
        }
        bits = Math.min(bits, checkPassword(ph).bits * 1.4);
        return { bits: Math.max(1, bits), warns };
      }

      let checkType = 'password';
      const CHECK = { bar: '#checkBar', strength: '#checkStrength', entropy: '#checkEntropy', crack: '#checkCrack' };
      function renderCheck() {
        const v = $('#check').value;
        $('#check').placeholder = t(checkType === 'pin' ? 'checkPhPin' : checkType === 'phrase' ? 'checkPhPhrase' : 'checkPh');
        $('#check').inputMode = checkType === 'pin' ? 'numeric' : 'text';
        $('#checkNote').textContent = t(checkType === 'pin' ? 'checkNotePin' : checkType === 'phrase' ? 'checkNotePhrase' : 'checkNote');
        $$('#checkType button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.ct === checkType)));
        let r;
        if (checkType === 'pin') {
          r = checkPin(v);
          // eigene Skala: Bewertung relativ zu dem, was eine PIN leisten kann
          const bar = $('#checkBar');
          if (!r.bits) {
            showMeter(0, CHECK);
          } else {
            // 4–5 zufällige Ziffern ≈ 13–17 Bit, 6–7 ≈ 20–23 Bit, ab 8 Ziffern ≥ 26 Bit
            const lv = r.top || r.bits < 10 ? 0 : r.bits < 17 ? 2 : r.bits < 24 ? 3 : 4;
            const label = lv === 0 ? 'pinWeak' : lv === 2 ? 'pinOk' : lv === 3 ? 'pinPhone' : 'pinBest';
            bar.style.width = Math.min(100, (r.bits / 27) * 100) + '%';
            bar.style.background = LEVEL_COLORS[lv];
            $('#checkStrength').textContent = t(label);
            $('#checkStrength').style.color = LEVEL_COLORS[lv];
            $('#checkEntropy').textContent = t('bits', Math.round(r.bits));
            const odds = Math.round(2 ** r.bits / 3);
            $('#checkCrack').textContent = r.top || odds < 10 ? t('pinTopChance') : t('pinChance', odds.toLocaleString(TV.lang === 'de' ? 'de-CH' : 'en-GB'));
          }
        } else {
          r = checkType === 'phrase' ? checkPhrase(v) : checkPassword(v);
          showMeter(r.bits, CHECK);
        }
        $('#checkWarns').innerHTML = r.warns.map((w) => `<li>${esc(t(w))}</li>`).join('');
      }
      $('#check').addEventListener('input', renderCheck);
      $$('#checkType button').forEach((b) =>
        b.addEventListener('click', () => {
          checkType = b.dataset.ct;
          renderCheck();
          $('#check').focus();
        }),
      );
      // #endregion

      TV.init({
        glyph: '*',
        strings: STRINGS,
        onLang: () => {
          if (current !== '') {
            showMeter(current === null ? 0 : genEntropy(+$('#lenNum').value), METER);
            if (current === null) generate();
          }
          renderCheck();
          $$('#bulk .btn').forEach((b) => (b.textContent = t('copy')));
        },
      });
      setMode('password');
    </script>
  </body>
</html>
