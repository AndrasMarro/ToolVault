      }

        font-size: 0.72rem;
        color: var(--text-muted);
      }
      .drop input {

        inset: 0;
        opacity: 0;

      .layout > .box {

      }

        background: transparent;
      }

        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
        gap: 8px;
      }

        border: 1px solid var(--border);

        gap: 2px;

    <script>
      const STRINGS = {
        de: {
          pageTitle: 'Video-Konverter',
          kicker: '// video-konverter · ffmpeg im browser',

          f_webm: 'VP8 · Web',
          f_gif: 'Animation',
          f_mp3: 'nur Ton',
          f_wav: 'Ton, verlustfrei',
          loadingCore: (p) => `Lade ffmpeg (einmalig ~31 MB) … ${p}`,
          coreFail: 'ffmpeg konnte nicht geladen werden. Internetverbindung prüfen und neu laden.',
          working: (p) => `Wandle um … ${p}%`,
          done: (s, d) => `Fertig in ${d}s · ${s}`,
          failed: 'Umwandeln fehlgeschlagen – siehe Log. Anderes Zielformat oder „ohne Neukodierung“ abwählen.',
          cancelled: 'Abgebrochen.',
          badTime: 'Zeitangabe ungültig',
          bigWarn: 'Grosse Datei – das Umwandeln im Browser kann einige Minuten dauern.',
          local: 'läuft lokal im Browser',
        },
        en: {
          pageTitle: 'Video Converter',
          kicker: '// video converter · ffmpeg in the browser',
          title: '<span class="accent">Convert</span>, trim and shrink videos.',
          lead: 'MP4, WebM, GIF, MP3 or WAV – with ffmpeg running right in your browser. Your file is never uploaded.',
          dropText: 'Choose or drop a video or audio file',
          dropHint: 'MP4 · MOV · WebM · MKV · AVI · MP3 · WAV · …',
          ytNote:
            '<b>YouTube links?</b> Fetching videos straight from YouTube isn’t possible here: a page without a server can’t technically access YouTube’s streams, and YouTube only allows downloads through its own app. You can save your own uploads via <b>YouTube Studio → Content → ⋮ → Download</b> and convert them here.',
          source: 'Source',
          setStart: '⇤ Start = now',
          setEnd: 'End = now ⇥',
          trimHint: 'Trim: start and end as m:ss or seconds. Empty end = until the end.',
          target: 'Target format',
          size: 'Size',
          original: 'Original',
          quality: 'Quality',
          q_high: 'High (bigger file)',
          q_medium: 'Balanced',
          q_small: 'Small (more compression)',
          audio: 'Audio',
          mute: 'Remove audio',
          speed: 'Speed',
          fastCopy: 'No re-encoding (trim only, very fast)',
          convert: '▶ Convert',
          cancel: '■ Cancel',
          result: 'Result',
          download: '⬇ Download',
          f_mp4: 'H.264 · plays anywhere',
          f_webm: 'VP8 · web',
          f_gif: 'animation',
          f_mp3: 'audio only',
          f_wav: 'audio, lossless',
          loadingCore: (p) => `Loading ffmpeg (one-time ~31 MB) … ${p}`,
          coreFail: 'Could not load ffmpeg. Check your connection and reload.',
          working: (p) => `Converting … ${p}%`,
          done: (s, d) => `Done in ${d}s · ${s}`,
          failed: 'Conversion failed – see the log. Try another format or untick “no re-encoding”.',
          cancelled: 'Cancelled.',
          badTime: 'Invalid time',
          bigWarn: 'Large file – converting in the browser can take a few minutes.',
          local: 'runs locally in your browser',
        },
      };

      const { $, $$, t, esc } = TV;

      // #region Formate
      const FORMATS = {
        mp4: { ext: 'mp4', mime: 'video/mp4', video: true, quality: true, copy: true },
        webm: { ext: 'webm', mime: 'video/webm', video: true, quality: true },
        gif: { ext: 'gif', mime: 'image/gif', video: true, gif: true },
        mp3: { ext: 'mp3', mime: 'audio/mpeg', quality: true },
        wav: { ext: 'wav', mime: 'audio/wav' },
      };
      let fmt = 'mp4';
      function renderFormats() {
        const box = $('#formats');
        box.innerHTML = '';
        Object.keys(FORMATS).forEach((k) => {
          const b = document.createElement('button');
          b.className = 'fmt';
          b.setAttribute('aria-pressed', String(k === fmt));
          b.innerHTML = `<b>${k.toUpperCase()}</b><span>${esc(t('f_' + k))}</span>`;
          b.addEventListener('click', () => {
            fmt = k;
            renderFormats();
          });
          box.appendChild(b);
        });
        const f = FORMATS[fmt];
        $$('[data-video]').forEach((el) => (el.hidden = !f.video));
        $$('[data-quality]').forEach((el) => (el.hidden = !f.quality));
        $$('[data-gif]').forEach((el) => (el.hidden = !f.gif));
        $$('[data-fastcopy]').forEach((el) => (el.hidden = !f.copy));
      }
      // #endregion

      // #region Datei
      let file = null;
      let duration = 0;
      const fmtBytes = (n) => (n < 1048576 ? (n / 1024).toFixed(0) + ' KB' : (n / 1048576).toFixed(1) + ' MB');
      const fmtTime = (s) => `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, '0')}`;
      function parseTime(v) {
        v = String(v).trim();
        if (!v) return null;
        if (/^\d+(\.\d+)?$/.test(v)) return +v;
        const m = v.match(/^(?:(\d+):)?(\d+):(\d+(?:\.\d+)?)$/);
        if (!m) return NaN;
        return (+m[1] || 0) * 3600 + +m[2] * 60 + +m[3];
      }
      function loadFile(f) {
        if (!f) return;
        file = f;
        const v = $('#srcVideo');
        v.src = URL.createObjectURL(f);
        $('#work').hidden = false;
        $('#resultBox').hidden = true;
        $('#srcInfo').textContent = `${f.name} · ${fmtBytes(f.size)}`;
        $('#tStart').value = '0:00.0';
        $('#tEnd').value = '';
        $('#status').textContent = f.size > 300 * 1048576 ? t('bigWarn') : '';
        $('#status').className = 'msg';
        if (f.type.startsWith('audio/') || /\.(mp3|wav|m4a|flac|ogg)$/i.test(f.name)) {
          if (FORMATS[fmt].video) fmt = 'mp3';
          renderFormats();
        }
        v.onloadedmetadata = () => {
          duration = v.duration || 0;
          $('#srcInfo').textContent = `${f.name} · ${fmtBytes(f.size)}${duration ? ' · ' + fmtTime(duration) : ''}${v.videoWidth ? ` · ${v.videoWidth}×${v.videoHeight}` : ''}`;
          $('#tEnd').placeholder = duration ? fmtTime(duration) : '';
        };
        $('#work').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
      $('#file').addEventListener('change', (e) => loadFile(e.target.files[0]));
      const drop = $('#drop');
      ['dragenter', 'dragover'].forEach((ev) => drop.addEventListener(ev, (e) => (e.preventDefault(), drop.classList.add('over'))));
      ['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, () => drop.classList.remove('over')));
      drop.addEventListener('drop', (e) => {
        e.preventDefault();
        loadFile(e.dataTransfer.files[0]);
      });
      $('#setStart').addEventListener('click', () => ($('#tStart').value = fmtTime($('#srcVideo').currentTime)));
      $('#setEnd').addEventListener('click', () => ($('#tEnd').value = fmtTime($('#srcVideo').currentTime)));
      // #endregion

      // #region ffmpeg
      const CORE_SOURCES = ['https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd', 'https://unpkg.com/@ffmpeg/core@0.12.10/dist/umd'];
      // Für lokale Tests: ?core=<url> (nur http/https)
      const override = new URLSearchParams(location.search).get('core');
      if (override && /^https?:\/\//.test(override)) CORE_SOURCES.unshift(override.replace(/\/$/, ''));

      let ffmpeg = null;
      let loadPromise = null;
      function setStatus(text, cls = '') {
        $('#status').className = 'msg ' + cls;
        $('#status').textContent = text;
      }
      function setBar(p) {
        $('#bar').style.width = Math.max(0, Math.min(100, p)) + '%';
      }
      const logEl = $('#log');
      function log(line) {
        logEl.textContent += line + '\n';
        if (logEl.textContent.length > 60000) logEl.textContent = logEl.textContent.slice(-40000);
        logEl.scrollTop = logEl.scrollHeight;
      }

      // Datei laden und als Blob-URL bereitstellen (wie toBlobURL aus @ffmpeg/util),
      // mit Fortschritt für die grosse .wasm-Datei
      async function toBlobURL(url, type, onProgress) {
        const res = await fetch(url);
        if (!res.ok) throw new Error(res.status + ' ' + url);
        const total = +res.headers.get('Content-Length') || 0;
        if (!onProgress || !res.body) return URL.createObjectURL(new Blob([await res.arrayBuffer()], { type }));
        const reader = res.body.getReader();
        const chunks = [];
        let received = 0;
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
          received += value.length;
          onProgress({ received, total });
        }
        return URL.createObjectURL(new Blob(chunks, { type }));
      }

      async function getFFmpeg() {
        if (ffmpeg && ffmpeg.loaded) return ffmpeg;
        if (loadPromise) return loadPromise;
        loadPromise = (async () => {
          const { FFmpeg } = FFmpegWASM;
          let lastErr;
          for (const base of CORE_SOURCES) {
            try {
              setStatus(t('loadingCore', ''));
              const coreURL = await toBlobURL(`${base}/ffmpeg-core.js`, 'text/javascript');
              const wasmURL = await toBlobURL(`${base}/ffmpeg-core.wasm`, 'application/wasm', ({ received, total }) => {
                if (total > 0) {
                  setBar((received / total) * 100);
                  setStatus(t('loadingCore', Math.round((received / total) * 100) + '%'));
                } else setStatus(t('loadingCore', fmtBytes(received)));
              });
              const ff = new FFmpeg();
              ff.on('log', ({ message }) => log(message));
              await ff.load({ coreURL, wasmURL });
              ffmpeg = ff;
              setBar(0);
              return ff;
            } catch (e) {
              lastErr = e;
              log('core load failed from ' + base + ': ' + (e.message || e));
            }
          }
          loadPromise = null;
          throw lastErr;
        })();
        return loadPromise;
      }

      function buildArgs(inName, outName) {
        const f = FORMATS[fmt];
        const args = [];
        const start = parseTime($('#tStart').value) || 0;
        const end = parseTime($('#tEnd').value);
        if (start > 0) args.push('-ss', String(start));
        args.push('-i', inName);
        if (end != null && end > start) args.push('-t', String(end - start));
        const q = $('#quality').value;
        const scale = +$('#scale').value;
        const vf = [];
        if (f.video && scale) vf.push(`scale=-2:'min(${scale},ih)'`);

        if (fmt === 'mp4') {
          if ($('#fastCopy').checked) {
            args.push('-c', 'copy');
            if ($('#mute').checked) args.push('-an');
          } else {
            if (vf.length) args.push('-vf', vf.join(','));
            args.push('-c:v', 'libx264', '-preset', 'veryfast', '-crf', { high: '20', medium: '24', small: '30' }[q], '-pix_fmt', 'yuv420p');
            if ($('#mute').checked) args.push('-an');
            else args.push('-c:a', 'aac', '-b:a', q === 'small' ? '96k' : '128k');
          }
          args.push('-movflags', '+faststart');
        } else if (fmt === 'webm') {
          if (vf.length) args.push('-vf', vf.join(','));
          args.push('-c:v', 'libvpx', '-deadline', 'realtime', '-cpu-used', '8', '-b:v', { high: '2.5M', medium: '1.2M', small: '600k' }[q], '-crf', { high: '10', medium: '20', small: '32' }[q]);
          if ($('#mute').checked) args.push('-an');
          else args.push('-c:a', 'libvorbis', '-q:a', '4');
        } else if (fmt === 'gif') {
          const fps = $('#fps').value;
          const w = scale ? Math.min(scale, 640) : 480;
          args.push('-vf', `fps=${fps},scale=${w}:-1:flags=lanczos,split[a][b];[a]palettegen=max_colors=192[p];[b][p]paletteuse=dither=bayer:bayer_scale=4`, '-loop', '0');
        } else if (fmt === 'mp3') {
          args.push('-vn', '-c:a', 'libmp3lame', '-b:a', { high: '256k', medium: '192k', small: '128k' }[q]);
        } else if (fmt === 'wav') {
          args.push('-vn', '-c:a', 'pcm_s16le');
        }
        args.push(outName);
        return args;
      }

      let running = false;
      async function convert() {
        if (!file || running) return;
        const start = parseTime($('#tStart').value);
        const end = parseTime($('#tEnd').value);
        if (Number.isNaN(start) || Number.isNaN(end)) return setStatus(t('badTime'), 'bad');
        running = true;
        $('#go').disabled = true;
        $('#cancel').hidden = false;
        $('#resultBox').hidden = true;
        logEl.textContent = '';
        const t0 = performance.now();
        let ff;
        try {
          ff = await getFFmpeg();
        } catch (e) {
          setStatus(t('coreFail'), 'bad');
          return finish();
        }
        const inExt = (file.name.match(/\.[a-z0-9]+$/i) || ['.bin'])[0].toLowerCase();
        const inName = 'input' + inExt;
        const outName = 'output.' + FORMATS[fmt].ext;
        const span = (end != null && end > (start || 0) ? end : duration) - (start || 0);
        const onProgress = ({ progress, time }) => {
          // progress ist bei -ss/-t unzuverlässig – aus der Zeit rechnen, wenn möglich
          let p = span > 0 && time > 0 ? time / 1e6 / span : progress;
          p = Math.max(0, Math.min(1, p || 0));
          setBar(p * 100);
          setStatus(t('working', Math.round(p * 100)));
        };
        ff.on('progress', onProgress);
        try {
          setStatus(t('working', 0));
          await ff.writeFile(inName, new Uint8Array(await file.arrayBuffer()));
          const args = buildArgs(inName, outName);
          log('$ ffmpeg ' + args.join(' '));
          const code = await ff.exec(args);
          if (code !== 0) throw new Error('exit ' + code);
          const data = await ff.readFile(outName);
          const blob = new Blob([data.buffer], { type: FORMATS[fmt].mime });
          showResult(blob, outName, ((performance.now() - t0) / 1000).toFixed(1));
          setBar(100);
        } catch (e) {
          if (!running) return;
          log(String(e && e.message ? e.message : e));
          setStatus(t('failed'), 'bad');
        } finally {
          ff.off?.('progress', onProgress);
          try {
            await ff.deleteFile(inName);
            await ff.deleteFile(outName);
          } catch (e) {}
          finish();
        }
      }
      function finish() {
        running = false;
        $('#go').disabled = false;
        $('#cancel').hidden = true;
      }
      $('#go').addEventListener('click', convert);
      $('#cancel').addEventListener('click', () => {
        if (!ffmpeg) return;
        running = false;
        ffmpeg.terminate();
        ffmpeg = null;
        loadPromise = null;
        setBar(0);
        setStatus(t('cancelled'), 'bad');
        finish();
      });

      let outUrl = null;
      function showResult(blob, outName, secs) {
        if (outUrl) URL.revokeObjectURL(outUrl);
        outUrl = URL.createObjectURL(blob);
        const base = file.name.replace(/\.[^.]+$/, '') || 'video';
        const name = `${base}.${FORMATS[fmt].ext}`;
        const box = $('#outPreview');
        box.innerHTML = '';
        let el;
        if (fmt === 'gif') {
          el = document.createElement('img');
          el.style.maxWidth = '100%';
          el.style.borderRadius = '10px';
        } else if (FORMATS[fmt].video) {
          el = document.createElement('video');
          el.controls = true;
          el.playsInline = true;
        } else {
          el = document.createElement('audio');
          el.controls = true;
        }
        el.src = outUrl;
        box.appendChild(el);
        $('#dl').href = outUrl;
        $('#dl').download = name;
        const ratio = file.size ? Math.round((blob.size / file.size) * 100) : 0;
        $('#outInfo').textContent = `${name} · ${fmtBytes(blob.size)} (${ratio}%)`;
        $('#resultBox').hidden = false;
        setStatus(t('done', fmtBytes(blob.size), secs), 'ok');
      }
      // #endregion

      TV.init({ glyph: '▶', strings: STRINGS, onLang: renderFormats });
      renderFormats();
    </script>
  </body>
</html>
