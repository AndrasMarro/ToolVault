<!doctype html>
<html lang="en" data-theme="graphite">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Generate strong random passwords, pronounceable passphrases and PINs with the Web Crypto API — nothing is sent or stored."
    />
    <title>Password Generator · ToolVault</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Montserrat:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../shared/tv.css" />
    <script src="../shared/tv.js"></script>

    <style>
      .result {
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px 18px;
        min-height: 74px;
      }
      .result .pw {
        flex: 1;
        font-family: var(--mono);
        font-size: clamp(1.05rem, 2.6vw, 1.45rem);
        font-weight: 500;
        word-break: break-all;
        line-height: 1.35;
        user-select: all;
      }
      .pw .d {
        color: #7fb4ff;
      }
      .pw .s {
        color: var(--accent);
      }
      [data-theme='paper'] .pw .d {
        color: #2456b8;
      }
      .meter {
        height: 6px;
        border-radius: 4px;
        background: var(--surface-2);
        overflow: hidden;
        margin-top: 14px;
      }
      .meter span {
        display: block;
        height: 100%;
        width: 0;
        border-radius: 4px;
        transition:
          width 0.25s ease,
          background 0.25s ease;
      }
      .meter-info {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        font-family: var(--mono);
        font-size: 0.78rem;
        color: var(--text-muted);
        margin-top: 8px;
      }
      .opt-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
        gap: 10px 18px;
      }
      .len-row {
        display: grid;
        grid-template-columns: auto 1fr 4.2em;
        gap: 12px;
        align-items: center;
        margin-bottom: 16px;
        font-family: var(--mono);
        font-size: 0.85rem;
      }
      .len-row input[type='number'] {
        padding: 6px 8px;
        text-align: center;
      }
      .bulk {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 6px;
      }
      .bulk li {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 7px 10px;
        font-family: var(--mono);
        font-size: 0.86rem;
        word-break: break-all;
      }
      .bulk li span {
        flex: 1;
      }
      .warns {
        margin: 10px 0 0;
        padding-left: 18px;
        font-size: 0.84rem;
        color: var(--text-muted);
      }
      .warns li::marker {
        color: var(--warn);
      }
      .note {
        font-size: 0.8rem;
        color: var(--text-muted);
        margin-top: 12px;
      }
    </style>
  </head>

  <body>
    <div class="wrap">
      <header class="topbar">
        <a class="wordmark" href="../index.html"
          ><span class="prompt">~/</span><span class="hub">ToolVault</span
          ><span class="prompt">/</span><span class="tool">password</span></a
        >
        <div class="topbar-right">
          <div class="themes" id="themes" role="group" aria-label="Theme"></div>
          <div class="lang" id="lang" role="group" aria-label="Language">
            <button data-lang="de">DE</button><span class="divider" aria-hidden="true">·</span
            ><button data-lang="en">EN</button>
          </div>
        </div>
      </header>

      <section class="hero">
        <p class="kicker" data-i18n="kicker"></p>
        <h1 data-i18n-html="title"></h1>
        <p data-i18n="lead"></p>
      </section>

      <div class="seg" role="tablist" style="margin-bottom: 14px">
        <button role="tab" data-mode="password" aria-selected="true" data-i18n="m_password"></button>
        <button role="tab" data-mode="phrase" aria-selected="false" data-i18n="m_phrase"></button>
        <button role="tab" data-mode="pin" aria-selected="false" data-i18n="m_pin"></button>
      </div>

      <div class="box">
        <div class="result">
          <div class="pw" id="pw" aria-live="polite"></div>
          <button class="btn" id="regen" data-i18n-title="regen">⟳</button>
          <button class="btn primary" id="copy" data-i18n="copy"></button>
        </div>
        <div class="meter"><span id="meterBar"></span></div>
        <div class="meter-info">
          <span id="strength"></span>
          <span id="entropy"></span>
          <span id="crack"></span>
        </div>
      </div>

      <div class="box">
        <h2 class="box-title"><span data-i18n="options"></span></h2>
        <div class="len-row">
          <span id="lenLabel" data-i18n="length"></span>
          <input type="range" id="len" min="4" max="64" value="20" />
          <input type="number" id="lenNum" min="4" max="128" value="20" aria-label="Length" />
        </div>

        <div class="opt-grid" data-for="password">
          <label class="check"><input type="checkbox" id="lower" checked /> a–z</label>
          <label class="check"><input type="checkbox" id="upper" checked /> A–Z</label>
          <label class="check"><input type="checkbox" id="digits" checked /> 0–9</label>
          <label class="check"><input type="checkbox" id="symbols" checked /> !@#$%&amp;*</label>
          <label class="check"><input type="checkbox" id="ambig" /> <span data-i18n="ambig"></span></label>
          <label class="check"><input type="checkbox" id="each" checked /> <span data-i18n="each"></span></label>
          <label class="field" style="grid-column: 1 / -1">
            <span data-i18n="exclude"></span>
            <input type="text" id="exclude" spellcheck="false" placeholder='e.g. {}[]"' />
          </label>
        </div>

        <div class="opt-grid" data-for="phrase" hidden>
          <label class="field">
            <span data-i18n="sep"></span>
            <select id="sep">
              <option value="-">- (dash)</option>
              <option value=".">. (dot)</option>
              <option value="_">_ (underscore)</option>
              <option value=" ">␣ (space)</option>
              <option value="">— (none)</option>
            </select>
          </label>
          <label class="check"><input type="checkbox" id="cap" checked /> <span data-i18n="cap"></span></label>
          <label class="check"><input type="checkbox" id="addNum" checked /> <span data-i18n="addNum"></span></label>
        </div>
        <p class="note" data-for="phrase" data-i18n="phraseNote" hidden></p>

        <div class="row" style="margin-top: 16px">
          <span class="muted mono" style="font-size: 0.8rem" data-i18n="bulk"></span>
          <div class="seg" id="bulkSeg">
            <button data-n="1" aria-selected="true">1</button>
            <button data-n="5" aria-selected="false">5</button>
            <button data-n="10" aria-selected="false">10</button>
            <button data-n="25" aria-selected="false">25</button>
          </div>
          <span class="spacer"></span>
          <button class="btn sm" id="copyAll" hidden data-i18n="copyAll"></button>
        </div>
        <ul class="bulk" id="bulk" style="margin-top: 12px"></ul>
      </div>

      <div class="box">
        <h2 class="box-title"><span data-i18n="checkTitle"></span></h2>
        <input type="text" id="check" spellcheck="false" autocomplete="off" data-i18n-ph="checkPh" />
        <div class="meter"><span id="checkBar"></span></div>
        <div class="meter-info">
          <span id="checkStrength"></span>
          <span id="checkEntropy"></span>
          <span id="checkCrack"></span>
        </div>
        <ul class="warns" id="checkWarns"></ul>
        <p class="note" data-i18n="checkNote"></p>
      </div>

      <footer class="footer">
        <a href="../index.html">← ToolVault</a><span>·</span><span>Password Generator v1.0</span
        ><span>·</span><span data-i18n="local"></span><span>·</span><span id="tv-year"></span>
      </footer>
    </div>

    <script>
      const STRINGS = {
        de: {
          pageTitle: 'Passwort-Generator',
          kicker: '// passwort-generator',
          title: 'Starke Passwörter, <span class="accent">echt zufällig</span>.',
          lead: 'Erzeugt mit der Web-Crypto-API direkt im Browser. Nichts wird gesendet oder gespeichert.',
          m_password: 'Passwort',
          m_phrase: 'Passphrase',
          m_pin: 'PIN',
          regen: 'Neu erzeugen (Leertaste)',
          copy: 'Kopieren',
          options: 'Optionen',
          length: 'Länge',
          words: 'Wörter',
          digitsLabel: 'Ziffern',
          ambig: 'Verwechselbare weglassen (Il1O0)',
          each: 'Aus jeder Gruppe mind. 1',
          exclude: 'Diese Zeichen ausschliessen',
          sep: 'Trennzeichen',
          cap: 'Wörter gross schreiben',
          addNum: 'Zahl anhängen',
          phraseNote:
            'Wörter sind aussprechbare Silbenfolgen (Konsonant-Vokal-Muster) – leicht zu tippen, Entropie exakt berechenbar.',
          bulk: 'Anzahl',
          copyAll: 'Alle kopieren',
          checkTitle: 'Eigenes Passwort prüfen',
          checkPh: 'Passwort eingeben – bleibt lokal',
          checkNote: 'Grobe Schätzung anhand Zeichenvorrat und typischer Muster. Ersetzt keinen Abgleich mit Leak-Datenbanken.',
          s0: 'sehr schwach',
          s1: 'schwach',
          s2: 'mittel',
          s3: 'stark',
          s4: 'sehr stark',
          bits: (b) => `${b} Bit Entropie`,
          crack: (t) => `≈ ${t} bei 10¹⁰ Versuchen/s`,
          noSet: 'Mindestens eine Zeichengruppe wählen.',
          w_short: 'Kürzer als 12 Zeichen.',
          w_repeat: 'Wiederholte Zeichen (z. B. „aaa“).',
          w_seq: 'Folgen wie „abc“ oder „123“.',
          w_common: 'Enthält ein sehr häufiges Passwort-Muster.',
          w_year: 'Enthält eine Jahreszahl.',
          w_onlyClass: 'Nur eine Zeichengruppe.',
          units: { s: 'Sek.', m: 'Min.', h: 'Std.', d: 'Tage', y: 'Jahre', inst: 'sofort', forever: 'Ewigkeiten' },
          local: 'läuft lokal im Browser',
        },
        en: {
          pageTitle: 'Password Generator',
          kicker: '// password generator',
          title: 'Strong passwords, <span class="accent">truly random</span>.',
          lead: 'Generated with the Web Crypto API right in your browser. Nothing is sent or stored.',
          m_password: 'Password',
          m_phrase: 'Passphrase',
          m_pin: 'PIN',
          regen: 'Regenerate (space)',
          copy: 'Copy',
          options: 'Options',
          length: 'Length',
          words: 'Words',
          digitsLabel: 'Digits',
          ambig: 'Avoid look-alikes (Il1O0)',
          each: 'At least 1 from each set',
          exclude: 'Exclude these characters',
          sep: 'Separator',
          cap: 'Capitalise words',
          addNum: 'Append a number',
          phraseNote:
            'Words are pronounceable syllable strings (consonant-vowel pattern) – easy to type, with exactly computable entropy.',
          bulk: 'Count',
          copyAll: 'Copy all',
          checkTitle: 'Check your own password',
          checkPh: 'Type a password – stays local',
          checkNote: 'Rough estimate based on character pool and common patterns. No substitute for checking breach databases.',
          s0: 'very weak',
          s1: 'weak',
          s2: 'fair',
          s3: 'strong',
          s4: 'very strong',
          bits: (b) => `${b} bits of entropy`,
          crack: (t) => `≈ ${t} at 10¹⁰ guesses/s`,
          noSet: 'Pick at least one character set.',
          w_short: 'Shorter than 12 characters.',
          w_repeat: 'Repeated characters (e.g. “aaa”).',
          w_seq: 'Sequences like “abc” or “123”.',
          w_common: 'Contains a very common password pattern.',
          w_year: 'Contains a year.',
          w_onlyClass: 'Only one character class.',
          units: { s: 'sec', m: 'min', h: 'hours', d: 'days', y: 'years', inst: 'instantly', forever: 'ages' },
          local: 'runs locally in your browser',
        },
      };

      const { $, $$, t, esc, copy } = TV;

      // #region Zufall — gleichverteilt per Rejection Sampling
      function randInt(max) {
        if (max <= 0) return 0;
        const limit = Math.floor(0x100000000 / max) * max;
        const buf = new Uint32Array(1);
        let x;
        do {
          crypto.getRandomValues(buf);
          x = buf[0];
        } while (x >= limit);
        return x % max;
      }
      const pick = (str) => str[randInt(str.length)];
      function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = randInt(i + 1);
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }
      // #endregion

      // #region Generatoren
      const SETS = {
        lower: 'abcdefghijklmnopqrstuvwxyz',
        upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
        digits: '0123456789',
        symbols: '!@#$%^&*()-_=+[]{};:,.<>/?~',
      };
      const AMBIG = 'Il1O0o|`\'"';
      const CONS = 'bdfghjklmnprstvz'; // 16
      const VOW = 'aeiou';

      let mode = 'password';
      let count = 1;

      function activeSets() {
        const ex = new Set(($('#exclude').value + ($('#ambig').checked ? AMBIG : '')).split(''));
        return Object.keys(SETS)
          .filter((k) => $('#' + k).checked)
          .map((k) => [...SETS[k]].filter((c) => !ex.has(c)).join(''))
          .filter(Boolean);
      }

      function genPassword(len) {
        const sets = activeSets();
        if (!sets.length) return null;
        const pool = sets.join('');
        const chars = [];
        if ($('#each').checked && len >= sets.length) sets.forEach((s) => chars.push(pick(s)));
        while (chars.length < len) chars.push(pick(pool));
        return shuffle(chars).join('');
      }

      // Aussprechbares Wort: K V K V K -> 16·5·16·5·16 Kombinationen
      const word = () => pick(CONS) + pick(VOW) + pick(CONS) + pick(VOW) + pick(CONS);
      function genPhrase(n) {
        const sep = $('#sep').value;
        const cap = $('#cap').checked;
        const words = Array.from({ length: n }, () => {
          const w = word();
          return cap ? w[0].toUpperCase() + w.slice(1) : w;
        });
        if ($('#addNum').checked) words.push(String(randInt(100)).padStart(2, '0'));
        return words.join(sep);
      }

      function genPin(n) {
        return Array.from({ length: n }, () => pick(SETS.digits)).join('');
      }

      // Entropie des Generators (nicht des Ergebnisses) in Bit
      function genEntropy(len) {
        if (mode === 'pin') return len * Math.log2(10);
        if (mode === 'phrase') {
          const perWord = Math.log2(CONS.length ** 3 * VOW.length ** 2);
          return len * perWord + ($('#addNum').checked ? Math.log2(100) : 0);
        }
        const pool = activeSets().join('').length;
        return pool ? len * Math.log2(pool) : 0;
      }
      // #endregion

      // #region Anzeige
      function crackTime(bits) {
        const u = t('units');
        // Durchschnitt: halber Suchraum
        const secs = 2 ** (bits - 1) / 1e10;
        if (secs < 1) return u.inst;
        const steps = [
          [60, 's', 1],
          [3600, 'm', 60],
          [86400, 'h', 3600],
          [31557600, 'd', 86400],
        ];
        for (const [lim, k, div] of steps) if (secs < lim) return Math.round(secs / div) + ' ' + u[k];
        const y = secs / 31557600;
        if (y > 1e15) return u.forever;
        if (y >= 1e6) return y.toExponential(1).replace('e+', '·10^') + ' ' + u.y;
        return Math.round(y).toLocaleString() + ' ' + u.y;
      }
      function level(bits) {
        return bits < 28 ? 0 : bits < 45 ? 1 : bits < 60 ? 2 : bits < 90 ? 3 : 4;
      }
      const LEVEL_COLORS = ['var(--bad)', 'var(--bad)', 'var(--warn)', 'var(--ok)', 'var(--ok)'];
      function showMeter(bits, ids) {
        const lv = level(bits);
        const bar = $(ids.bar);
        bar.style.width = Math.min(100, (bits / 128) * 100) + '%';
        bar.style.background = LEVEL_COLORS[lv];
        $(ids.strength).textContent = bits ? t('s' + lv) : '';
        $(ids.strength).style.color = bits ? LEVEL_COLORS[lv] : '';
        $(ids.entropy).textContent = bits ? t('bits', Math.round(bits)) : '';
        $(ids.crack).textContent = bits ? t('crack', crackTime(bits)) : '';
      }

      const colorize = (pw) =>
        [...pw]
          .map((c) => (/\d/.test(c) ? `<span class="d">${esc(c)}</span>` : /[a-z]/i.test(c) ? esc(c) : `<span class="s">${esc(c)}</span>`))
          .join('');

      let current = '';
      let bulkList = [];
      function generate() {
        const len = Number($('#lenNum').value);
        const gen = mode === 'password' ? genPassword : mode === 'phrase' ? genPhrase : genPin;
        current = gen(len);
        if (current === null) {
          $('#pw').innerHTML = `<span class="muted" style="font-size:0.9rem">${esc(t('noSet'))}</span>`;
          showMeter(0, METER);
          $('#bulk').innerHTML = '';
          return;
        }
        $('#pw').innerHTML = colorize(current);
        showMeter(genEntropy(len), METER);

        bulkList = count > 1 ? Array.from({ length: count }, () => gen(len)) : [];
        $('#copyAll').hidden = count === 1;
        $('#bulk').innerHTML = '';
        bulkList.forEach((p) => {
          const li = document.createElement('li');
          li.innerHTML = `<span>${colorize(p)}</span>`;
          const b = document.createElement('button');
          b.className = 'btn sm';
          b.textContent = t('copy');
          b.addEventListener('click', () => copy(p));
          li.appendChild(b);
          $('#bulk').appendChild(li);
        });
      }
      const METER = { bar: '#meterBar', strength: '#strength', entropy: '#entropy', crack: '#crack' };
      // #endregion

      // #region Modus + Längen-Grenzen
      const LIMITS = {
        password: { min: 4, max: 128, slider: 64, def: 20, label: 'length' },
        phrase: { min: 2, max: 12, slider: 12, def: 5, label: 'words' },
        pin: { min: 4, max: 16, slider: 16, def: 6, label: 'digitsLabel' },
      };
      const lenVals = { password: 20, phrase: 5, pin: 6 };

      function setMode(m) {
        mode = m;
        const L = LIMITS[m];
        $$('[data-mode]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.mode === m)));
        $$('[data-for]').forEach((el) => (el.hidden = el.dataset.for !== m));
        $('#len').min = L.min;
        $('#len').max = L.slider;
        $('#lenNum').min = L.min;
        $('#lenNum').max = L.max;
        $('#lenNum').value = lenVals[m];
        $('#len').value = Math.min(lenVals[m], L.slider);
        $('#lenLabel').dataset.i18n = L.label;
        $('#lenLabel').textContent = t(L.label);
        generate();
      }

      $$('[data-mode]').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));
      $('#len').addEventListener('input', () => {
        $('#lenNum').value = $('#len').value;
        lenVals[mode] = +$('#len').value;
        generate();
      });
      $('#lenNum').addEventListener('change', () => {
        const L = LIMITS[mode];
        const v = Math.min(L.max, Math.max(L.min, Math.round(+$('#lenNum').value || L.def)));
        $('#lenNum').value = v;
        $('#len').value = Math.min(v, L.slider);
        lenVals[mode] = v;
        generate();
      });
      ['lower', 'upper', 'digits', 'symbols', 'ambig', 'each', 'cap', 'addNum'].forEach((id) =>
        $('#' + id).addEventListener('change', generate),
      );
      ['exclude'].forEach((id) => $('#' + id).addEventListener('input', generate));
      $('#sep').addEventListener('change', generate);
      $$('#bulkSeg button').forEach((b) =>
        b.addEventListener('click', () => {
          count = +b.dataset.n;
          $$('#bulkSeg button').forEach((x) => x.setAttribute('aria-selected', String(x === b)));
          generate();
        }),
      );
      $('#regen').addEventListener('click', generate);
      $('#copy').addEventListener('click', () => current && copy(current));
      $('#copyAll').addEventListener('click', () => bulkList.length && copy(bulkList.join('\n'), bulkList.length + '×'));
      // Leertaste = neu erzeugen (ausser beim Tippen)
      document.addEventListener('keydown', (e) => {
        const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && document.activeElement.type !== 'checkbox' && document.activeElement.type !== 'range';
        if (e.code === 'Space' && !typing && document.activeElement.tagName !== 'BUTTON') {
          e.preventDefault();
          generate();
        }
      });
      // #endregion

      // #region Prüfer
      const COMMON = ['password', 'passwort', 'qwert', 'asdf', 'letmein', 'welcome', 'admin', 'iloveyou', 'monkey', 'dragon', 'master', 'sunshine', 'hallo', 'login', 'abc123', '123456', '111111', 'football', 'baseball', 'trustno1', 'shadow', 'michael', 'secret', 'geheim', 'schatz'];

      function checkPassword(pw) {
        const warns = [];
        if (!pw) return { bits: 0, warns };
        let pool = 0;
        const classes = [/[a-z]/, /[A-Z]/, /\d/, /[^a-zA-Z\d]/].filter((r) => r.test(pw));
        if (/[a-z]/.test(pw)) pool += 26;
        if (/[A-Z]/.test(pw)) pool += 26;
        if (/\d/.test(pw)) pool += 10;
        if (/[^a-zA-Z\d]/.test(pw)) pool += 33;
        let bits = pw.length * Math.log2(pool);
        const lower = pw.toLowerCase();

        if (pw.length < 12) warns.push('w_short');
        if (classes.length === 1) warns.push('w_onlyClass');
        if (/(.)\1\1/.test(pw)) {
          warns.push('w_repeat');
          bits *= 0.75;
        }
        let seq = 0;
        for (let i = 2; i < lower.length; i++) {
          const a = lower.charCodeAt(i - 2),
            b = lower.charCodeAt(i - 1),
            c = lower.charCodeAt(i);
          if ((b - a === 1 && c - b === 1) || (a - b === 1 && b - c === 1)) seq++;
        }
        if (seq) {
          warns.push('w_seq');
          bits -= seq * 4;
        }
        if (COMMON.some((w) => lower.includes(w))) {
          warns.push('w_common');
          bits *= 0.4;
        }
        if (/(19|20)\d\d/.test(pw)) {
          warns.push('w_year');
          bits -= 6;
        }
        return { bits: Math.max(1, bits), warns };
      }

      function renderCheck() {
        const { bits, warns } = checkPassword($('#check').value);
        showMeter(bits, { bar: '#checkBar', strength: '#checkStrength', entropy: '#checkEntropy', crack: '#checkCrack' });
        $('#checkWarns').innerHTML = warns.map((w) => `<li>${esc(t(w))}</li>`).join('');
      }
      $('#check').addEventListener('input', renderCheck);
      // #endregion

      TV.init({
        glyph: '*',
        strings: STRINGS,
        onLang: () => {
          if (current !== '') {
            showMeter(current === null ? 0 : genEntropy(+$('#lenNum').value), METER);
            if (current === null) generate();
          }
          renderCheck();
          $$('#bulk .btn').forEach((b) => (b.textContent = t('copy')));
        },
      });
      setMode('password');
    </script>
  </body>
</html>
