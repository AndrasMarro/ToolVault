    <script>
      const STRINGS = {
        de: {
          pageTitle: 'Encode & Hash',
          kicker: '// encode · decode · hash',
          title: 'Kodieren, dekodieren, <span class="accent">hashen</span>.',
          lead: 'Base64, URL, HTML-Entities, Hex, Binär und Unicode-Escapes – dazu MD5/SHA-Hashes, HMAC und ein JWT-Inspektor. Alles bleibt im Browser.',
          plain: 'Klartext',
          encoded: 'Kodiert',
          plainPh: 'Text hier eingeben …',
          codedPh: 'Kodierten Text hier einfügen …',
          encode: 'Kodieren →',
          decode: '← Dekodieren',
          copy: 'Kopieren',
          live: 'Live',
          fileToB64: 'Datei → Base64',
          urlSafe: 'URL-sicher (-_)',
          dataUri: 'als Data-URI',
          wrap: 'Zeilen à 76',
          component: 'Komponente (encodeURIComponent)',
          plusSpace: 'Leerzeichen als +',
          allEntities: 'Alle Nicht-ASCII-Zeichen',
          sepSpace: 'Mit Leerzeichen',
          upper: 'Grossbuchstaben',
          onlyNonAscii: 'Nur Nicht-ASCII',
          decodeErr: (m) => 'Dekodieren fehlgeschlagen: ' + m,
          chars: (c, b) => `${c} Zeichen · ${b} Bytes`,
          fileLoaded: (n, s) => `${n} geladen (${s})`,
          hashInput: 'Eingabe',
          hmacKey: 'HMAC-Schlüssel (optional, nur SHA)',
          hashFile: 'Datei hashen',
          digests: 'Prüfsummen',
          compare: 'Mit erwartetem Hash vergleichen',
          match: (a) => '✓ Stimmt überein: ' + a,
          noMatch: '✕ Keine Übereinstimmung',
          jwtToken: 'Token',
          jwtPh: 'eyJhbGciOi… einfügen',
          jwtNote: 'Die Signatur wird nicht geprüft – dafür wäre der geheime Schlüssel nötig. Nur dekodieren, nie blind vertrauen.',
          jwtBad: 'Kein gültiges JWT (erwartet: drei Base64url-Teile mit Punkt getrennt).',
          expired: 'abgelaufen',
          valid: 'gültig',
          notYet: 'noch nicht gültig',
          expiresIn: (s) => 'läuft ab in ' + s,
          ago: (s) => 'vor ' + s,
          local: 'läuft lokal im Browser',
        },
        en: {
          pageTitle: 'Encode & Hash',
          kicker: '// encode · decode · hash',
          title: 'Encode, decode, <span class="accent">hash</span>.',
          lead: 'Base64, URL, HTML entities, hex, binary and Unicode escapes – plus MD5/SHA hashes, HMAC and a JWT inspector. Everything stays in your browser.',
          plain: 'Plain text',
          encoded: 'Encoded',
          plainPh: 'Type text here …',
          codedPh: 'Paste encoded text here …',
          encode: 'Encode →',
          decode: '← Decode',
          copy: 'Copy',
          live: 'Live',
          fileToB64: 'File → Base64',
          urlSafe: 'URL-safe (-_)',
          dataUri: 'as data URI',
          wrap: 'Wrap at 76',
          component: 'Component (encodeURIComponent)',
          plusSpace: 'Spaces as +',
          allEntities: 'All non-ASCII chars',
          sepSpace: 'Space separated',
          upper: 'Uppercase',
          onlyNonAscii: 'Non-ASCII only',
          decodeErr: (m) => 'Decoding failed: ' + m,
          chars: (c, b) => `${c} chars · ${b} bytes`,
          fileLoaded: (n, s) => `${n} loaded (${s})`,
          hashInput: 'Input',
          hmacKey: 'HMAC key (optional, SHA only)',
          hashFile: 'Hash a file',
          digests: 'Digests',
          compare: 'Compare with expected hash',
          match: (a) => '✓ Matches ' + a,
          noMatch: '✕ No match',
          jwtToken: 'Token',
          jwtPh: 'Paste eyJhbGciOi…',
          jwtNote: 'The signature is not verified – that would need the secret key. Decode only, never trust blindly.',
          jwtBad: 'Not a valid JWT (expected three base64url parts separated by dots).',
          expired: 'expired',
          valid: 'valid',
          notYet: 'not yet valid',
          expiresIn: (s) => 'expires in ' + s,
          ago: (s) => s + ' ago',
          local: 'runs locally in your browser',
        },
      };

      const { $, $$, t, esc, copy } = TV;
      const enc = new TextEncoder();
      const dec = new TextDecoder('utf-8', { fatal: true });

      // #region Byte-Helfer
      const bytesToBin = (bytes) => {
        let s = '';
        for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
        return s;
      };
      const binToBytes = (s) => Uint8Array.from(s, (c) => c.charCodeAt(0));
      const toB64 = (bytes) => btoa(bytesToBin(bytes));
      const fromB64 = (s) => {
        s = s.replace(/^data:[^,]*,/, '').replace(/\s+/g, '').replace(/-/g, '+').replace(/_/g, '/');
        while (s.length % 4) s += '=';
        return binToBytes(atob(s));
      };
      const toHex = (bytes, upper) => {
        const h = Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join('');
        return upper ? h.toUpperCase() : h;
      };
      const fmtBytes = (n) => (n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(2) + ' MB');
      // #endregion

      // #region Codecs — jeder mit encode/decode + Optionen
      const opt = (id) => $('#opt-' + id)?.checked;
      const CODECS = {
        base64: {
          opts: ['urlSafe', 'wrap'],
          encode: (s) => {
            let out = toB64(enc.encode(s));
            if (opt('urlSafe')) out = out.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            if (opt('wrap')) out = out.replace(/(.{76})/g, '$1\n').trim();
            return out;
          },
          decode: (s) => dec.decode(fromB64(s)),
        },
        url: {
          opts: ['component', 'plusSpace'],
          encode: (s) => {
            let out = opt('component') ? encodeURIComponent(s) : encodeURI(s);
            if (opt('plusSpace')) out = out.replace(/%20/g, '+');
            return out;
          },
          decode: (s) => decodeURIComponent(opt('plusSpace') ? s.replace(/\+/g, ' ') : s),
        },
        html: {
          opts: ['allEntities'],
          encode: (s) => {
            const basic = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
            return [...s]
              .map((c) => basic[c] || (opt('allEntities') && c.codePointAt(0) > 126 ? '&#' + c.codePointAt(0) + ';' : c))
              .join('');
          },
          decode: (s) => {
            const ta = document.createElement('textarea');
            ta.innerHTML = s;
            return ta.value;
          },
        },
        hex: {
          opts: ['sepSpace', 'upper'],
          encode: (s) => {
            const h = toHex(enc.encode(s), opt('upper'));
            return opt('sepSpace') ? h.replace(/(..)(?!$)/g, '$1 ') : h;
          },
          decode: (s) => {
            const clean = s.replace(/0x/gi, '').replace(/[^0-9a-f]/gi, '');
            if (clean.length % 2) throw new Error('odd number of hex digits');
            return dec.decode(Uint8Array.from(clean.match(/../g) || [], (h) => parseInt(h, 16)));
          },
        },
        bin: {
          opts: ['sepSpace'],
          encode: (s) =>
            Array.from(enc.encode(s), (b) => b.toString(2).padStart(8, '0')).join(opt('sepSpace') ? ' ' : ''),
          decode: (s) => {
            const clean = s.replace(/[^01]/g, '');
            if (clean.length % 8) throw new Error('bit count is not a multiple of 8');
            return dec.decode(Uint8Array.from(clean.match(/.{8}/g) || [], (b) => parseInt(b, 2)));
          },
        },
        unicode: {
          opts: ['onlyNonAscii'],
          encode: (s) =>
            [...s]
              .map((c) => {
                const cp = c.codePointAt(0);
                if (opt('onlyNonAscii') && cp < 128) return c;
                return cp > 0xffff ? '\\u{' + cp.toString(16) + '}' : '\\u' + cp.toString(16).padStart(4, '0');
              })
              .join(''),
          decode: (s) =>
            s
              .replace(/\\u\{([0-9a-f]+)\}/gi, (_, h) => String.fromCodePoint(parseInt(h, 16)))
              .replace(/\\u([0-9a-f]{4})/gi, (_, h) => String.fromCharCode(parseInt(h, 16)))
              .replace(/\\x([0-9a-f]{2})/gi, (_, h) => String.fromCharCode(parseInt(h, 16))),
        },
      };
      const OPT_DEFAULTS = { component: true, sepSpace: true };
      // #endregion

      // #region Codec-UI
      let tab = 'base64';
      let lastDir = 'enc';
      const plain = $('#plain');
      const coded = $('#coded');
      const codecMsg = $('#codecMsg');

      function renderOpts() {
        const box = $('#codecOpts');
        const c = CODECS[tab];
        const keep = {};
        $$('#codecOpts input').forEach((i) => (keep[i.id.slice(4)] = i.checked));
        box.innerHTML = '';
        (c?.opts || []).forEach((o) => {
          const l = document.createElement('label');
          l.className = 'check';
          const checked = o in keep ? keep[o] : !!OPT_DEFAULTS[o];
          l.innerHTML = `<input type="checkbox" id="opt-${o}" ${checked ? 'checked' : ''}/> <span>${esc(t(o))}</span>`;
          l.querySelector('input').addEventListener('change', () => run(lastDir));
          box.appendChild(l);
        });
        $('#fileBtn').hidden = tab !== 'base64';
        if (tab === 'base64') {
          const l = document.createElement('label');
          l.className = 'check';
          l.innerHTML = `<input type="checkbox" id="opt-dataUri"/> <span>${esc(t('dataUri'))}</span>`;
          box.appendChild(l);
        }
      }

      function info() {
        $('#inInfo').textContent = t('chars', [...plain.value].length, enc.encode(plain.value).length);
      }

      function run(dir) {
        const c = CODECS[tab];
        if (!c) return;
        lastDir = dir;
        codecMsg.textContent = '';
        plain.classList.remove('is-bad');
        coded.classList.remove('is-bad');
        try {
          if (dir === 'enc') coded.value = plain.value ? c.encode(plain.value) : '';
          else plain.value = coded.value ? c.decode(coded.value) : '';
        } catch (e) {
          codecMsg.className = 'msg bad';
          codecMsg.textContent = t('decodeErr', e.message || String(e));
          (dir === 'enc' ? plain : coded).classList.add('is-bad');
        }
        info();
      }

      plain.addEventListener('input', () => $('#live').checked ? run('enc') : info());
      coded.addEventListener('input', () => $('#live').checked && run('dec'));
      $('#enc').addEventListener('click', () => run('enc'));
      $('#dec').addEventListener('click', () => run('dec'));

      $('#file').addEventListener('change', async (e) => {
        const f = e.target.files[0];
        if (!f) return;
        const bytes = new Uint8Array(await f.arrayBuffer());
        let out = toB64(bytes);
        if (opt('dataUri')) out = `data:${f.type || 'application/octet-stream'};base64,` + out;
        else if (opt('wrap')) out = out.replace(/(.{76})/g, '$1\n').trim();
        coded.value = out;
        plain.value = '';
        codecMsg.className = 'msg ok';
        codecMsg.textContent = t('fileLoaded', f.name, fmtBytes(f.size));
        e.target.value = '';
      });
      // #endregion

      // #region Hash — MD5 (eigene Implementierung) + SHA via Web Crypto
      function md5(bytes) {
        const K = new Uint32Array(64);
        for (let i = 0; i < 64; i++) K[i] = Math.floor(Math.abs(Math.sin(i + 1)) * 2 ** 32);
        const S = [7, 12, 17, 22, 5, 9, 14, 20, 4, 11, 16, 23, 6, 10, 15, 21];
        const len = bytes.length;
        const padLen = (((len + 8) >> 6) + 1) << 6;
        const buf = new Uint8Array(padLen);
        buf.set(bytes);
        buf[len] = 0x80;
        const dv = new DataView(buf.buffer);
        dv.setUint32(padLen - 8, (len * 8) >>> 0, true);
        dv.setUint32(padLen - 4, Math.floor(len / 0x20000000), true);
        let a0 = 0x67452301,
          b0 = 0xefcdab89,
          c0 = 0x98badcfe,
          d0 = 0x10325476;
        const M = new Uint32Array(16);
        for (let off = 0; off < padLen; off += 64) {
          for (let i = 0; i < 16; i++) M[i] = dv.getUint32(off + i * 4, true);
          let A = a0,
            B = b0,
            C = c0,
            D = d0;
          for (let i = 0; i < 64; i++) {
            let F, g;
            if (i < 16) {
              F = (B & C) | (~B & D);
              g = i;
            } else if (i < 32) {
              F = (D & B) | (~D & C);
              g = (5 * i + 1) % 16;
            } else if (i < 48) {
              F = B ^ C ^ D;
              g = (3 * i + 5) % 16;
            } else {
              F = C ^ (B | ~D);
              g = (7 * i) % 16;
            }
            F = (F + A + K[i] + M[g]) >>> 0;
            A = D;
            D = C;
            C = B;
            const s = S[(i >> 4) * 4 + (i % 4)];
            B = (B + ((F << s) | (F >>> (32 - s)))) >>> 0;
          }
          a0 = (a0 + A) >>> 0;
          b0 = (b0 + B) >>> 0;
          c0 = (c0 + C) >>> 0;
          d0 = (d0 + D) >>> 0;
        }
        const out = new Uint8Array(16);
        const odv = new DataView(out.buffer);
        [a0, b0, c0, d0].forEach((v, i) => odv.setUint32(i * 4, v, true));
        return out;
      }

      // CRC32 — praktisch für Datei-Prüfsummen
      const CRC_TABLE = (() => {
        const t = new Uint32Array(256);
        for (let n = 0; n < 256; n++) {
          let c = n;
          for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
          t[n] = c >>> 0;
        }
        return t;
      })();
      function crc32(bytes) {
        let c = 0xffffffff;
        for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
        c = (c ^ 0xffffffff) >>> 0;
        return new Uint8Array([c >>> 24, (c >>> 16) & 255, (c >>> 8) & 255, c & 255]);
      }

      let hashBytes = new Uint8Array();
      let hashFmt = 'hex';
      let lastDigests = [];
      let hashSeq = 0;

      const fmtDigest = (b) => (hashFmt === 'b64' ? toB64(b) : toHex(b, hashFmt === 'HEX'));

      async function runHash() {
        const seq = ++hashSeq;
        const key = $('#hmacKey').value;
        const algos = ['SHA-1', 'SHA-256', 'SHA-384', 'SHA-512'];
        const rows = [];
        if (!key) {
          rows.push(['CRC32', crc32(hashBytes)]);
          rows.push(['MD5', md5(hashBytes)]);
        }
        for (const a of algos) {
          let d;
          if (key) {
            const k = await crypto.subtle.importKey('raw', enc.encode(key), { name: 'HMAC', hash: a }, false, ['sign']);
            d = await crypto.subtle.sign('HMAC', k, hashBytes);
          } else d = await crypto.subtle.digest(a, hashBytes);
          rows.push([(key ? 'HMAC-' : '') + a, new Uint8Array(d)]);
        }
        if (seq !== hashSeq) return; // veraltete Berechnung verwerfen
        lastDigests = rows;
        const box = $('#digests');
        box.innerHTML = '';
        rows.forEach(([name, bytes]) => {
          const val = fmtDigest(bytes);
          const k = document.createElement('span');
          k.className = 'k';
          k.textContent = name;
          const v = document.createElement('span');
          v.className = 'v';
          v.textContent = val;
          const b = document.createElement('button');
          b.className = 'btn sm';
          b.textContent = t('copy');
          b.addEventListener('click', () => copy(val, name));
          box.append(k, v, b);
        });
        $('#hashInfo').textContent = fmtBytes(hashBytes.length);
        compare();
      }

      function compare() {
        const want = $('#cmp').value.trim();
        const msg = $('#cmpMsg');
        if (!want) {
          msg.textContent = '';
          return;
        }
        const norm = want.replace(/\s/g, '');
        const hit = lastDigests.find(
          ([, b]) => toHex(b).toLowerCase() === norm.toLowerCase() || toB64(b) === norm,
        );
        msg.className = 'msg ' + (hit ? 'ok' : 'bad');
        msg.textContent = hit ? t('match', hit[0]) : t('noMatch');
      }

      $('#hashIn').addEventListener('input', () => {
        hashBytes = enc.encode($('#hashIn').value);
        runHash();
      });
      $('#hmacKey').addEventListener('input', runHash);
      $('#cmp').addEventListener('input', compare);
      $('#hashFile').addEventListener('change', async (e) => {
        const f = e.target.files[0];
        if (!f) return;
        hashBytes = new Uint8Array(await f.arrayBuffer());
        $('#hashIn').value = '';
        $('#hashIn').placeholder = '📄 ' + f.name + ' · ' + fmtBytes(f.size);
        runHash();
        e.target.value = '';
      });
      $$('#hashFmt button').forEach((b) =>
        b.addEventListener('click', () => {
          hashFmt = b.dataset.fmt;
          $$('#hashFmt button').forEach((x) => x.setAttribute('aria-selected', String(x === b)));
          runHash();
        }),
      );
      // #endregion

      // #region JWT
      const b64urlJson = (s) => JSON.parse(dec.decode(fromB64(s)));
      function rel(secs) {
        const a = Math.abs(secs);
        const de = TV.lang === 'de';
        if (a < 60) return Math.round(a) + (de ? ' Sek.' : ' s');
        if (a < 3600) return Math.round(a / 60) + (de ? ' Min.' : ' min');
        if (a < 86400) return Math.round(a / 3600) + (de ? ' Std.' : ' h');
        return Math.round(a / 86400) + (de ? ' Tagen' : ' days');
      }

      function runJwt() {
        const raw = $('#jwt').value.trim().replace(/^Bearer\s+/i, '');
        const msg = $('#jwtMsg');
        ['#jwtHead', '#jwtBody', '#claims', '#jwtRaw'].forEach((s) => ($(s).innerHTML = ''));
        msg.textContent = '';
        if (!raw) return;
        const parts = raw.split('.');
        try {
          if (parts.length !== 3) throw new Error();
          const head = b64urlJson(parts[0]);
          const body = b64urlJson(parts[1]);
          $('#jwtRaw').innerHTML = `<span class="h">${esc(parts[0])}</span>.<span class="p">${esc(parts[1])}</span>.<span class="s">${esc(parts[2])}</span>`;
          $('#jwtHead').textContent = JSON.stringify(head, null, 2);
          $('#jwtBody').textContent = JSON.stringify(body, null, 2);

          const now = Date.now() / 1000;
          const rows = [];
          ['iat', 'nbf', 'exp'].forEach((k) => {
            if (typeof body[k] !== 'number') return;
            const d = new Date(body[k] * 1000);
            let note = '';
            if (k === 'exp') note = body.exp < now ? `${t('expired')} · ${t('ago', rel(now - body.exp))}` : t('expiresIn', rel(body.exp - now));
            else note = body[k] > now ? t('notYet') : t('ago', rel(now - body[k]));
            rows.push(`<span class="k">${k}</span><span class="v">${esc(d.toLocaleString(TV.lang === 'de' ? 'de-CH' : 'en-GB'))}</span><span class="pill">${esc(note)}</span>`);
          });
          $('#claims').innerHTML = rows.join('');
          const expired = typeof body.exp === 'number' && body.exp < now;
          msg.className = 'msg ' + (expired ? 'bad' : 'ok');
          msg.textContent = `alg: ${head.alg || '?'} · ${expired ? t('expired') : t('valid')}`;
        } catch (e) {
          msg.className = 'msg bad';
          msg.textContent = t('jwtBad');
        }
      }
      $('#jwt').addEventListener('input', runJwt);
      // #endregion

      // #region Tabs
      function setTab(id) {
        tab = id;
        $$('#tabs [data-tab]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === id)));
        $('#view-codec').hidden = !(id in CODECS);
        $('#view-hash').hidden = id !== 'hash';
        $('#view-jwt').hidden = id !== 'jwt';
        if (id in CODECS) {
          renderOpts();
          // Klartext ist die Quelle: beim Wechsel neu kodieren
          run(plain.value || !coded.value ? 'enc' : 'dec');
          plain.focus();
        } else if (id === 'hash') {
          runHash();
          $('#hashIn').focus();
        } else $('#jwt').focus();
        try {
          history.replaceState(null, '', '#' + id);
        } catch (e) {}
      }
      $$('#tabs [data-tab]').forEach((b) => b.addEventListener('click', () => setTab(b.dataset.tab)));
      // #endregion

      TV.init({
        glyph: '%',
        strings: STRINGS,
        onLang: () => {
          if (tab in CODECS) renderOpts();
          info();
          if (tab === 'hash') runHash();
          if (tab === 'jwt') runJwt();
        },
      });
      const startTab = location.hash.slice(1);
      setTab($$('#tabs [data-tab]').some((b) => b.dataset.tab === startTab) ? startTab : 'base64');
    </script>
  </body>
</html>
