<!doctype html>
<html lang="en" data-theme="graphite">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Count words and characters, change case, sort and dedupe lines, slugify and find & replace — a text toolkit that runs in the browser."
    />
    <title>Text Toolkit · ToolVault</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Montserrat:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../shared/tv.css" />
    <script src="../shared/tv.js"></script>

    <style>
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        gap: 14px;
        align-items: start;
      }
      .layout > .box,
      .layout > .stack > .box:first-child {
        margin-top: 0;
      }
      #text {
        min-height: 380px;
        font-size: 0.92rem;
      }
      .actions h3 {
        font-family: var(--mono);
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-muted);
        margin: 16px 0 8px;
        font-weight: 500;
      }
      .actions h3:first-child {
        margin-top: 0;
      }
      .btns {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
      .freq {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 4px;
        font-family: var(--mono);
        font-size: 0.8rem;
      }
      .freq li {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        position: relative;
        padding: 3px 6px;
        border-radius: 5px;
        overflow: hidden;
      }
      .freq li::before {
        content: '';
        position: absolute;
        inset: 0;
        width: var(--w);
        background: var(--accent-soft);
        z-index: 0;
      }
      .freq li > * {
        position: relative;
      }
      .fr-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      @media (max-width: 860px) {
        .layout {
          grid-template-columns: 1fr;
        }
        .fr-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
      <link rel="stylesheet" href="../shared/fx.css" />
      <script src="../shared/fx.js"></script>
  </head>

  <body>
    <div class="wrap">
      <header class="topbar">
        <a class="wordmark" href="../index.html"
          ><span class="prompt">~/</span><span class="hub">ToolVault</span
          ><span class="prompt">/</span><span class="tool">text</span></a
        >
        <div class="topbar-right">
          <div class="themes" id="themes" role="group" aria-label="Theme"></div>
          <div class="lang" id="lang" role="group" aria-label="Language">
            <button data-lang="de">DE</button><span class="divider" aria-hidden="true">·</span
            ><button data-lang="en">EN</button>
          </div>
        </div>
      </header>

      <section class="hero">
        <p class="kicker" data-i18n="kicker"></p>
        <h1 data-i18n-html="title"></h1>
        <p data-i18n="lead"></p>
      </section>

      <div class="layout">
        <div class="stack">
          <div class="box">
            <h2 class="box-title">
              <span data-i18n="text"></span>
              <span class="row" style="gap: 6px">
                <button class="btn sm" id="undo" disabled data-i18n="undo"></button>
                <button class="btn sm" data-copy="#text" data-i18n="copy"></button>
                <button class="btn sm" id="clear" data-i18n="clear"></button>
              </span>
            </h2>
            <textarea id="text" spellcheck="true" data-i18n-ph="placeholder"></textarea>
            <div class="msg" id="msg"></div>
          </div>

          <div class="box">
            <h2 class="box-title"><span data-i18n="findReplace"></span></h2>
            <div class="fr-grid">
              <input type="text" id="find" spellcheck="false" data-i18n-ph="find" />
              <input type="text" id="repl" spellcheck="false" data-i18n-ph="replace" />
            </div>
            <div class="row" style="margin-top: 10px">
              <label class="check"><input type="checkbox" id="frRegex" /> Regex</label>

              <label class="check"><input type="checkbox" id="frWord" /> <span data-i18n="wholeWord"></span></label>
              <span class="spacer"></span>

          </div>

          <div class="box actions">
            <h3 data-i18n="g_case"></h3>
            <div class="btns">
              <button class="btn sm" data-act="upper">UPPER</button>
              <button class="btn sm" data-act="lower">lower</button>
              <button class="btn sm" data-act="title">Title Case</button>
              <button class="btn sm" data-act="sentence">Sentence case</button>
              <button class="btn sm" data-act="swap">sWAP cASE</button>
              <button class="btn sm" data-act="camel">camelCase</button>
              <button class="btn sm" data-act="pascal">PascalCase</button>
              <button class="btn sm" data-act="snake">snake_case</button>
              <button class="btn sm" data-act="kebab">kebab-case</button>
              <button class="btn sm" data-act="constant">CONSTANT_CASE</button>
              <button class="btn sm" data-act="slug">slugify</button>
            </div>
            <h3 data-i18n="g_lines"></h3>
            <div class="btns">
              <button class="btn sm" data-act="sortAz" data-i18n="sortAz"></button>
              <button class="btn sm" data-act="sortZa" data-i18n="sortZa"></button>
              <button class="btn sm" data-act="sortNum" data-i18n="sortNum"></button>
              <button class="btn sm" data-act="sortLen" data-i18n="sortLen"></button>
              <button class="btn sm" data-act="reverseLines" data-i18n="reverseLines"></button>
              <button class="btn sm" data-act="shuffle" data-i18n="shuffle"></button>
              <button class="btn sm" data-act="dedupe" data-i18n="dedupe"></button>
              <button class="btn sm" data-act="noBlank" data-i18n="noBlank"></button>
              <button class="btn sm" data-act="number" data-i18n="number"></button>
              <button class="btn sm" data-act="unnumber" data-i18n="unnumber"></button>
            </div>
            <h3 data-i18n="g_clean"></h3>
            <div class="btns">
              <button class="btn sm" data-act="trim" data-i18n="trim"></button>
              <button class="btn sm" data-act="spaces" data-i18n="spaces"></button>
              <button class="btn sm" data-act="join" data-i18n="join"></button>
              <button class="btn sm" data-act="stripHtml" data-i18n="stripHtml"></button>
              <button class="btn sm" data-act="accents" data-i18n="accents"></button>
              <button class="btn sm" data-act="smartQuotes" data-i18n="smartQuotes"></button>
              <button class="btn sm" data-act="reverse" data-i18n="reverse"></button>
            </div>
          </div>
        </div>

        <aside class="stack">
          <div class="box">
            <h2 class="box-title"><span data-i18n="stats"></span></h2>
            <div class="stats" id="stats"></div>
          </div>
          <div class="box">
            <h2 class="box-title"><span data-i18n="topWords"></span></h2>
            <ol class="freq" id="freq"></ol>
          </div>
        </aside>
      </div>

      <footer class="footer">
        <a href="../index.html">← ToolVault</a><span>·</span><span>Text Toolkit v1.0</span><span>·</span
        ><span data-i18n="local"></span><span>·</span><span id="tv-year"></span>
      </footer>
    </div>

    <script>
      const STRINGS = {
        de: {
          pageTitle: 'Text-Werkzeug',
          kicker: '// text-werkzeug',
          title: 'Text zählen, <span class="accent">umformen</span>, aufräumen.',
          lead: 'Wörter und Zeichen zählen, Schreibweisen umwandeln, Zeilen sortieren und Duplikate entfernen. Mit Rückgängig und Suchen & Ersetzen.',
          text: 'Text',
          placeholder: 'Text hier einfügen oder tippen …',
          undo: '↶ Rückgängig',
          copy: 'Kopieren',
          clear: 'Leeren',
          findReplace: 'Suchen & Ersetzen',
          find: 'Suchen …',
          replace: 'Ersetzen durch …',
          matchCase: 'Gross/klein',
          wholeWord: 'Ganzes Wort',
          replaceAll: 'Alle ersetzen',
          hits: (n) => n + (n === 1 ? ' Treffer' : ' Treffer'),
          badRegex: 'Ungültiger Regex',
          replaced: (n) => `${n} ersetzt.`,
          g_case: 'Schreibweise',
          g_lines: 'Zeilen',
          g_clean: 'Aufräumen',
          sortAz: 'A → Z',
          sortZa: 'Z → A',
          sortNum: '1 → 9',
          sortLen: 'nach Länge',
          reverseLines: 'umkehren',
          shuffle: 'mischen',
          dedupe: 'Duplikate weg',
          noBlank: 'Leerzeilen weg',
          number: 'nummerieren',
          unnumber: 'Nummern weg',
          trim: 'Zeilen trimmen',
          spaces: 'Mehrfach-Leerzeichen',
          join: 'Umbrüche entfernen',
          stripHtml: 'HTML entfernen',
          accents: 'Akzente entfernen',
          smartQuotes: '„Typo“ → "ASCII"',
          reverse: 'Text spiegeln',
          stats: 'Statistik',
          topWords: 'Häufigste Wörter',
          s_chars: 'Zeichen',
          s_noSpace: 'ohne Leerz.',
          s_words: 'Wörter',
          s_lines: 'Zeilen',
          s_sent: 'Sätze',
          s_para: 'Absätze',
          s_read: 'Lesezeit',
          s_speak: 'Sprechzeit',
          s_bytes: 'Bytes (UTF-8)',
          s_unique: 'Eindeutige Wörter',
          done: (n) => `${n} angewendet.`,
          removed: (n) => `${n} Zeile(n) entfernt.`,
          none: '–',
          local: 'läuft lokal im Browser',
        },
        en: {
          pageTitle: 'Text Toolkit',
          kicker: '// text toolkit',
          title: 'Count, <span class="accent">transform</span> and tidy text.',
          lead: 'Count words and characters, convert case, sort lines and remove duplicates. With undo and find & replace.',
          text: 'Text',
          placeholder: 'Paste or type text here …',
          undo: '↶ Undo',
          copy: 'Copy',
          clear: 'Clear',
          findReplace: 'Find & replace',
          find: 'Find …',
          replace: 'Replace with …',
          matchCase: 'Match case',
          wholeWord: 'Whole word',
          replaceAll: 'Replace all',
          hits: (n) => n + (n === 1 ? ' match' : ' matches'),
          badRegex: 'Invalid regex',
          replaced: (n) => `${n} replaced.`,
          g_case: 'Case',
          g_lines: 'Lines',
          g_clean: 'Clean up',
          sortAz: 'A → Z',
          sortZa: 'Z → A',
          sortNum: '1 → 9',
          sortLen: 'by length',
          reverseLines: 'reverse',
          shuffle: 'shuffle',
          dedupe: 'remove duplicates',
          noBlank: 'remove blank lines',
          number: 'number',
          unnumber: 'strip numbers',
          trim: 'trim lines',
          spaces: 'collapse spaces',
          join: 'remove line breaks',
          stripHtml: 'strip HTML',
          accents: 'remove accents',
          smartQuotes: '“Smart” → "ASCII"',
          reverse: 'reverse text',
          stats: 'Statistics',
          topWords: 'Top words',
          s_chars: 'Characters',
          s_noSpace: 'w/o spaces',
          s_words: 'Words',
          s_lines: 'Lines',
          s_sent: 'Sentences',
          s_para: 'Paragraphs',
          s_read: 'Reading time',
          s_speak: 'Speaking time',
          s_bytes: 'Bytes (UTF-8)',
          s_unique: 'Unique words',
          done: (n) => `${n} applied.`,
          removed: (n) => `${n} line(s) removed.`,
          none: '–',
          local: 'runs locally in your browser',
        },
      };

      const { $, $$, t, esc } = TV;
      const ta = $('#text');
      const msg = $('#msg');

      // #region Wörter / Segmentierung
      const seg = 'Segmenter' in Intl ? new Intl.Segmenter(undefined, { granularity: 'word' }) : null;
      function words(s) {
        if (seg) return [...seg.segment(s)].filter((x) => x.isWordLike).map((x) => x.segment);
        return s.match(/[\p{L}\p{N}][\p{L}\p{N}'’-]*/gu) || [];
      }
      // Wortgrenzen für Case-Umwandlungen: camelCase, snake_case, Leerzeichen …
      const splitIdent = (s) =>
        s
          .replace(/([\p{Ll}\d])(\p{Lu})/gu, '$1 $2')
          .replace(/(\p{Lu})(\p{Lu}\p{Ll})/gu, '$1 $2')
          .split(/[^\p{L}\p{N}]+/u)
          .filter(Boolean);
      const cap = (w) => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
      // Pro Zeile anwenden, damit Listen erhalten bleiben
      const perLine = (fn) => (s) => s.split('\n').map(fn).join('\n');
      const stripAccents = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '');
      // #endregion

      // #region Aktionen
      const SMALL = new Set('a an and as at but by for in nor of on or the to vs via und oder der die das ein eine im am zu von mit'.split(' '));
      const linesOf = (s) => s.split('\n');
      const ACTIONS = {
        upper: (s) => s.toUpperCase(),
        lower: (s) => s.toLowerCase(),
        title: perLine((l) =>
          l.toLowerCase().replace(/[\p{L}\p{N}][^\s-]*/gu, (w, i) => (i > 0 && SMALL.has(w) ? w : w.charAt(0).toUpperCase() + w.slice(1))),
        ),
        sentence: (s) => s.toLowerCase().replace(/(^\s*|[.!?]\s+|\n\s*)(\p{L})/gu, (m, p, c) => p + c.toUpperCase()),
        swap: (s) => [...s].map((c) => (c === c.toUpperCase() ? c.toLowerCase() : c.toUpperCase())).join(''),
        camel: perLine((l) => splitIdent(l).map((w, i) => (i ? cap(w) : w.toLowerCase())).join('')),
        pascal: perLine((l) => splitIdent(l).map(cap).join('')),
        snake: perLine((l) => splitIdent(l).map((w) => w.toLowerCase()).join('_')),
        kebab: perLine((l) => splitIdent(l).map((w) => w.toLowerCase()).join('-')),
        constant: perLine((l) => splitIdent(l).map((w) => w.toUpperCase()).join('_')),
        slug: perLine((l) =>
          stripAccents(l.replace(/ß/g, 'ss').replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/Ä/g, 'Ae').replace(/Ö/g, 'Oe').replace(/Ü/g, 'Ue'))
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/^-+|-+$/g, ''),
        ),
        sortAz: (s) => linesOf(s).sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base', numeric: true })).join('\n'),
        sortZa: (s) => linesOf(s).sort((a, b) => b.localeCompare(a, undefined, { sensitivity: 'base', numeric: true })).join('\n'),
        sortNum: (s) => {
          const n = (l) => {
            const m = l.match(/-?\d+(?:[.,]\d+)?/);
            return m ? parseFloat(m[0].replace(',', '.')) : Infinity;
          };
          return linesOf(s).sort((a, b) => n(a) - n(b)).join('\n');
        },
        sortLen: (s) => linesOf(s).sort((a, b) => a.length - b.length).join('\n'),
        reverseLines: (s) => linesOf(s).reverse().join('\n'),
        shuffle: (s) => {
          const a = linesOf(s);
          const r = new Uint32Array(a.length);
          crypto.getRandomValues(r);
          for (let i = a.length - 1; i > 0; i--) {
            const j = r[i] % (i + 1);
            [a[i], a[j]] = [a[j], a[i]];
          }
          return a.join('\n');
        },
        dedupe: (s) => [...new Set(linesOf(s))].join('\n'),
        noBlank: (s) => linesOf(s).filter((l) => l.trim()).join('\n'),
        number: (s) => {
          const a = linesOf(s);
          const w = String(a.length).length;
          return a.map((l, i) => String(i + 1).padStart(w, ' ') + '. ' + l).join('\n');
        },
        unnumber: perLine((l) => l.replace(/^\s*(?:\d+[.)]|[-*•])\s+/, '')),
        trim: perLine((l) => l.trim()),
        spaces: perLine((l) => l.replace(/[ \t]{2,}/g, ' ')),
        join: (s) => s.replace(/\s*\n\s*/g, ' ').trim(),
        stripHtml: (s) => {
          const doc = new DOMParser().parseFromString(s, 'text/html');
          doc.querySelectorAll('br').forEach((b) => b.replaceWith('\n'));
          doc.querySelectorAll('p,div,li,h1,h2,h3,h4,h5,h6,tr').forEach((b) => b.append('\n'));
          return (doc.body.textContent || '').replace(/\n{3,}/g, '\n\n').trim();
        },
        accents: (s) => stripAccents(s),
        smartQuotes: (s) =>
          s
            .replace(/[„“”«»]/g, '"')
            .replace(/[‚‘’‹›]/g, "'")
            .replace(/[–—]/g, '-')
            .replace(/…/g, '...')
            .replace(/ /g, ' '),
        reverse: (s) => [...s].reverse().join(''),
      };

      // Rückgängig-Stapel
      const undoStack = [];
      function apply(next, label) {
        if (next === ta.value) return;
        undoStack.push(ta.value);
        if (undoStack.length > 100) undoStack.shift();
        $('#undo').disabled = false;
        const before = linesOf(ta.value).length;
        ta.value = next;
        const removed = before - linesOf(next).length;
        msg.className = 'msg ok';
        msg.textContent = removed > 0 && /dedupe|noBlank/.test(label) ? t('removed', removed) : t('done', label);
        update();
      }
      $$('[data-act]').forEach((b) =>
        b.addEventListener('click', () => {
          const label = b.dataset.act;
          // Nur Markierung umformen, falls etwas markiert ist
          const { selectionStart: a, selectionEnd: z, value } = ta;
          if (z > a) {
            const part = ACTIONS[label](value.slice(a, z));
            apply(value.slice(0, a) + part + value.slice(z), b.textContent);
            ta.setSelectionRange(a, a + part.length);
          } else apply(ACTIONS[label](value), b.textContent);
        }),
      );
      $('#undo').addEventListener('click', () => {
        if (!undoStack.length) return;
        ta.value = undoStack.pop();
        $('#undo').disabled = !undoStack.length;
        msg.textContent = '';
        update();
      });
      $('#clear').addEventListener('click', () => apply('', 'clear'));
      document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'z' && document.activeElement !== ta && undoStack.length) {
          e.preventDefault();
          $('#undo').click();
        }
      });
      // #endregion

      // #region Suchen & Ersetzen
      function buildRegex() {
        const f = $('#find').value;
        if (!f) return null;
        let src = $('#frRegex').checked ? f : f.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        if ($('#frWord').checked) src = '(?<![\\p{L}\\p{N}_])(?:' + src + ')(?![\\p{L}\\p{N}_])';
        return new RegExp(src, 'gu' + ($('#frCase').checked ? '' : 'i'));
      }
      function countMatches() {
        const pill = $('#frCount');
        $('#find').classList.remove('is-bad');
        try {
          const re = buildRegex();
          if (!re) return (pill.textContent = '');
          const n = (ta.value.match(re) || []).length;
          pill.textContent = t('hits', n);
          pill.className = 'pill' + (n ? ' ok' : '');
        } catch (e) {
          $('#find').classList.add('is-bad');
          pill.textContent = t('badRegex');
          pill.className = 'pill bad';
        }
      }
      ['#find', '#frRegex', '#frCase', '#frWord'].forEach((s) => $(s).addEventListener('input', countMatches));
      $('#frGo').addEventListener('click', () => {
        let re;
        try {
          re = buildRegex();
        } catch (e) {
          return;
        }
        if (!re) return;
        const n = (ta.value.match(re) || []).length;
        if (!n) return;
        // Ersatz: bei Regex $1 usw. erlaubt, sonst wörtlich; \n und \t immer interpretieren
        let rep = $('#repl').value.replace(/\\n/g, '\n').replace(/\\t/g, '\t');
        if (!$('#frRegex').checked) rep = rep.replace(/\$/g, '$$$$');
        apply(ta.value.replace(re, rep), 'replace');
        msg.textContent = t('replaced', n);
      });
      $('#find').addEventListener('keydown', (e) => e.key === 'Enter' && $('#frGo').click());
      $('#repl').addEventListener('keydown', (e) => e.key === 'Enter' && $('#frGo').click());
      // #endregion

      // #region Statistik
      const STOP = new Set(
        'the a an and or of to in is it that for on with as was are be this at by from not but have has i you he she we they der die das und ist ein eine zu den von mit sich des auf für im dem nicht es als auch an er sie wir ich du so wie aus bei oder'.split(' '),
      );
      function fmtTime(minutes) {
        if (minutes < 1) return Math.max(1, Math.round(minutes * 60)) + ' s';
        const m = Math.floor(minutes);
        const s = Math.round((minutes - m) * 60);
        return m + ' min' + (s ? ' ' + s + ' s' : '');
      }
      function update() {
        const s = ta.value;
        const w = words(s);
        const lines = s ? s.split('\n').length : 0;
        const sentences = (s.match(/[^.!?…]+[.!?…]+(?=\s|$)/g) || []).length || (w.length ? 1 : 0);
        const paragraphs = s.split(/\n\s*\n/).filter((p) => p.trim()).length;
        const lower = w.map((x) => x.toLowerCase());
        const unique = new Set(lower).size;
        const items = [
          [[...s].length, 's_chars'],
          [[...s.replace(/\s/g, '')].length, 's_noSpace'],
          [w.length, 's_words'],
          [unique, 's_unique'],
          [lines, 's_lines'],
          [sentences, 's_sent'],
          [paragraphs, 's_para'],
          [new TextEncoder().encode(s).length, 's_bytes'],
          [w.length ? fmtTime(w.length / 230) : t('none'), 's_read'],
          [w.length ? fmtTime(w.length / 140) : t('none'), 's_speak'],
        ];
        $('#stats').innerHTML = items
          .map(([n, k]) => `<div class="stat"><div class="n">${esc(typeof n === 'number' ? n.toLocaleString() : n)}</div><div class="l">${esc(t(k))}</div></div>`)
          .join('');

        const freq = {};
        lower.forEach((x) => {
          if (x.length > 2 && !STOP.has(x) && !/^\d+$/.test(x)) freq[x] = (freq[x] || 0) + 1;
        });
        const top = Object.entries(freq)
          .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
          .slice(0, 10);
        const max = top.length ? top[0][1] : 1;
        $('#freq').innerHTML = top.length
          ? top.map(([word, n]) => `<li style="--w:${(n / max) * 100}%"><span>${esc(word)}</span><span>${n}</span></li>`).join('')
          : `<li class="muted"><span>${esc(t('none'))}</span></li>`;
        countMatches();
        try {
          sessionStorage.setItem('tv-text', s);
        } catch (e) {}
      }
      ta.addEventListener('input', () => {
        msg.textContent = '';
        update();
      });
      // #endregion

      TV.init({ glyph: 'T', strings: STRINGS, onLang: update });
      try {
        ta.value = sessionStorage.getItem('tv-text') || '';
      } catch (e) {}
      update();
      ta.focus();
    </script>
  </body>
</html>
