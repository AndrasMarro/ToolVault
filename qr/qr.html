    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="QR Studio: create styled QR codes for links, Wi-Fi, contacts and more, and decode QR codes from images or the camera — all in the browser."
    />
    <title>QR Studio · ToolVault</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Montserrat:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../shared/tv.css" />
    <script src="../shared/tv.js"></script>
    <script src="../shared/vendor/qrcode-generator.js"></script>
    <script src="../shared/vendor/jsQR.js"></script>

    <style>
      .studio {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        gap: 14px;
        align-items: start;
      }
      .studio > .stack > .box:first-child,
      .studio > .box {
        margin-top: 0;
      }
      .preview-box {
        position: sticky;
        top: 16px;
      }
      .qr-stage {
        display: grid;
        place-items: center;
        background:
          repeating-conic-gradient(var(--surface-2) 0 25%, var(--bg) 0 50%) 0 0 / 16px 16px;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 18px;
        aspect-ratio: 1;
      }
      .qr-stage canvas {
        width: 100%;
        height: auto;
        image-rendering: pixelated;
        border-radius: 4px;
      }
      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 12px;
      }
      .form-grid .wide {
        grid-column: 1 / -1;
      }
      .opt-row {
        display: grid;
        grid-template-columns: 7.5em 1fr auto;
        gap: 10px;
        align-items: center;
        font-size: 0.84rem;
        color: var(--text-muted);
      }
      .opt-row + .opt-row {
        margin-top: 12px;
      }
      .opt-row .val {
        font-family: var(--mono);
        font-size: 0.78rem;
        min-width: 4em;
        text-align: right;
        color: var(--text);
      }
      .color-pair {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .color-pair input[type='color'] {
        width: 38px;
        height: 34px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg);
        padding: 2px;
        cursor: pointer;
      }
      .color-pair input[type='text'] {
        width: 8.5em;
        padding: 7px 9px;
      }
      .seg.small button {
        padding: 5px 9px;
        font-size: 0.74rem;
      }
      .verify {
        font-family: var(--mono);
        font-size: 0.78rem;
        margin-top: 10px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      /* Lesen */
      .drop {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        text-align: center;
        border: 1.5px dashed var(--border);
        border-radius: 12px;
        padding: 30px 16px;
        cursor: pointer;
        transition:
          border-color 0.15s ease,
          background 0.15s ease;
        position: relative;
        background: var(--bg);
        color: var(--text);
        font: inherit;
        width: 100%;
      }
      .drop:hover,
      .drop.over {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .drop .big {
        font-size: 1.6rem;
      }
      .drop .hint {
        font-family: var(--mono);
        font-size: 0.72rem;
        color: var(--text-muted);
      }
      .drop input {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: pointer;
      }
      .cam {
        position: relative;
        border-radius: 12px;
        overflow: hidden;
        background: #000;
        aspect-ratio: 4 / 3;
        margin-top: 14px;
      }
      .cam video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .cam .reticle {
        position: absolute;
        inset: 18%;
        border: 2px solid var(--accent);
        border-radius: 14px;
        box-shadow: 0 0 0 999px rgba(0, 0, 0, 0.35);
        pointer-events: none;
      }
      .cam .close {
        position: absolute;
        top: 10px;
        right: 10px;
      }
      .payload {
        font-family: var(--mono);
        font-size: 1rem;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .payload a {
        color: var(--accent);
      }
      .thumb {
        width: 64px;
        height: 64px;
        object-fit: cover;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg);
      }
      details.adv summary {
        cursor: pointer;
        font-family: var(--mono);
        font-size: 0.78rem;
        color: var(--text-muted);
        padding: 4px 0;
      }
      details.adv summary:hover {
        color: var(--accent);
      }
      .hexdump {
        font-family: var(--mono);
        font-size: 0.74rem;
        white-space: pre;
        overflow: auto;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 10px 12px;
        margin: 0;
        max-height: 260px;
        font-variant-ligatures: none;
      }
      @media (max-width: 820px) {
        .studio {
          grid-template-columns: 1fr;
        }
        .preview-box {
          position: static;
        }
      }
    </style>
  </head>

    <div class="wrap">
      <header class="topbar">
        <a class="wordmark" href="../index.html"
          ><span class="prompt">~/</span><span class="hub">ToolVault</span
          ><span class="prompt">/</span><span class="tool">qr</span></a
        >
        <div class="topbar-right">
          <div class="themes" id="themes" role="group" aria-label="Theme"></div>
          <div class="lang" id="lang" role="group" aria-label="Language">
            <button data-lang="de">DE</button><span class="divider" aria-hidden="true">·</span
            ><button data-lang="en">EN</button>
          </div>
        </div>
      </header>

      <section class="hero">
        <p class="kicker" data-i18n="kicker"></p>
        <h1 data-i18n-html="title"></h1>
        <p data-i18n="lead"></p>
      </section>

      <div class="seg" role="tablist" id="modeTabs" style="margin-bottom: 14px">
        <button role="tab" data-mode="create" aria-selected="true" data-i18n="m_create"></button>
        <button role="tab" data-mode="read" aria-selected="false" data-i18n="m_read"></button>
      </div>

      <!-- ===================== Erstellen ===================== -->
      <section id="view-create" class="studio">

            <div class="seg small" id="typeTabs" style="margin-bottom: 14px"></div>
            <div class="form-grid" id="fields"></div>
          </div>

          <div class="box">
            <h2 class="box-title"><span data-i18n="design"></span><button class="btn sm" id="resetStyle" data-i18n="reset"></button></h2>
            <div class="opt-row">
              <span data-i18n="fg"></span>
              <span class="color-pair"><input type="color" id="fg" value="#15120f" /><input type="text" id="fgHex" value="#15120f" spellcheck="false" /></span>
              <span></span>
            </div>
            <div class="opt-row">
              <span data-i18n="bg"></span>
              <span class="color-pair"
                ><input type="color" id="bg" value="#ffffff" /><input type="text" id="bgHex" value="#ffffff" spellcheck="false" />
                <label class="check"><input type="checkbox" id="transparent" /> <span data-i18n="transparent"></span></label
              ></span>
              <span></span>
            </div>
            <div class="opt-row">
              <span data-i18n="modules"></span>
              <span class="seg small" id="shapeSeg">
                <button data-shape="square" aria-selected="true">■ square</button>
                <button data-shape="rounded" aria-selected="false">▢ rounded</button>
                <button data-shape="dots" aria-selected="false">● dots</button>
              </span>
              <span></span>
            </div>
            <div class="opt-row">

                <button data-eye="rounded" aria-selected="false">▢ rounded</button>
              </span>
              <span></span>
            </div>
            <div class="opt-row">
              <span data-i18n="ecc"></span>
              <span class="seg small" id="eccSeg">
                <button data-ecc="L" aria-selected="false">L 7%</button>
                <button data-ecc="M" aria-selected="true">M 15%</button>
                <button data-ecc="Q" aria-selected="false">Q 25%</button>
                <button data-ecc="H" aria-selected="false">H 30%</button>
              </span>
              <span></span>
            </div>
            <div class="opt-row">
              <span data-i18n="margin"></span>
              <input type="range" id="margin" min="0" max="8" value="4" />
              <span class="val" id="marginVal">4</span>
            </div>
            <div class="opt-row">
              <span data-i18n="size"></span>
              <input type="range" id="size" min="128" max="2048" step="64" value="1024" />
              <span class="val" id="sizeVal">1024 px</span>
            </div>
            <div class="opt-row">
              <span data-i18n="logo"></span>
              <span class="row" style="gap: 8px">
                <label class="btn sm" style="position: relative"
                  ><span data-i18n="logoPick"></span
                  ><input type="file" id="logo" accept="image/*" style="position: absolute; inset: 0; opacity: 0; cursor: pointer"
                /></label>
                <button class="btn sm" id="logoClear" hidden data-i18n="remove"></button>
              </span>
              <span></span>
            </div>
            <p class="msg" id="logoNote" style="font-size: 0.76rem"></p>
          </div>
        </div>

        <div class="box preview-box">
          <h2 class="box-title"><span data-i18n="preview"></span><span class="pill" id="qrInfo"></span></h2>
          <div class="qr-stage"><canvas id="qrCanvas" width="512" height="512" aria-label="QR code"></canvas></div>
          <div class="verify" id="verify"></div>
          <div class="row" style="margin-top: 14px">
            <button class="btn primary" id="dlPng">⬇ PNG</button>
            <button class="btn" id="dlSvg">⬇ SVG</button>
            <button class="btn" id="copyPng" data-i18n="copyImg"></button>
          </div>
          <p class="msg" id="genMsg"></p>
        </div>
      </section>

      <!-- ===================== Lesen ===================== -->
      <section id="view-read" hidden>
        <div class="cols">
          <label class="drop" id="drop">
            <span class="big">⬆</span>
            <span data-i18n="dropText"></span>
            <span class="hint" data-i18n="dropHint"></span>
            <input type="file" id="readFile" accept="image/*" />
          </label>
          <button class="drop" id="camBtn" type="button">
            <span class="big">◉</span>
            <span data-i18n="camText"></span>
            <span class="hint" data-i18n="camHint"></span>
          </button>
        </div>
        <div class="cam" id="cam" hidden>
          <video id="video" playsinline muted></video>
          <div class="reticle"></div>
          <button class="btn sm close" id="camClose" data-i18n="close"></button>
        </div>
        <p class="msg" id="readMsg"></p>

        <div class="box" id="readResult" hidden style="margin-top: 14px">
          <h2 class="box-title"><span class="pill ok" id="typeBadge"></span><span class="muted mono" id="srcName" style="text-transform: none; letter-spacing: 0"></span></h2>
          <div class="row" style="align-items: flex-start; flex-wrap: nowrap">
            <img class="thumb" id="thumb" alt="" />
            <div class="payload" id="payload" style="flex: 1; min-width: 0"></div>
          </div>
          <div class="row" id="actions" style="margin-top: 12px"></div>
          <div class="stats" id="readStats" style="margin-top: 14px"></div>
          <div class="kv" id="parsed" style="margin-top: 14px"></div>
          <details class="adv" style="margin-top: 14px">
            <summary data-i18n="advanced"></summary>
            <div class="kv" id="tech" style="margin-top: 10px"></div>
            <pre class="hexdump" id="hex" style="margin-top: 10px"></pre>
          </details>
          <div class="row" style="margin-top: 14px">
            <button class="btn sm" id="toCreate" data-i18n="toCreate"></button>
          </div>
        </div>
      </section>

      <footer class="footer">
        <a href="../index.html">← ToolVault</a><span>·</span><span>QR Studio v2.0</span><span>·</span
        ><span data-i18n="local"></span><span>·</span><span id="tv-year"></span>
      </footer>
    </div>

      // WLAN/MeCard-Sonderzeichen maskieren
      const wEsc = (s) => s.replace(/([\\;,":])/g, '\\$1');
      const vEsc = (s) => s.replace(/([\\;,])/g, '\\$1').replace(/\n/g, '\\n');
      const val = (id) => ($('#f-' + id)?.type === 'checkbox' ? $('#f-' + id).checked : ($('#f-' + id)?.value || '').trim());

      const BUILD = {
        text: () => $('#f-text')?.value || '',
        wifi: () => {
          const sec = val('sec');
          return `WIFI:T:${sec};S:${wEsc(val('ssid'))};${sec !== 'nopass' ? 'P:' + wEsc(val('pass')) + ';' : ''}${val('hidden') ? 'H:true;' : ''};`;
        },
        vcard: () => {
          const l = ['BEGIN:VCARD', 'VERSION:3.0', `N:${vEsc(val('last'))};${vEsc(val('first'))};;;`, `FN:${vEsc((val('first') + ' ' + val('last')).trim())}`];
          if (val('org')) l.push('ORG:' + vEsc(val('org')));
          if (val('jobtitle')) l.push('TITLE:' + vEsc(val('jobtitle')));
          if (val('phone')) l.push('TEL;TYPE=CELL:' + val('phone'));
          if (val('mail')) l.push('EMAIL:' + val('mail'));
          if (val('url')) l.push('URL:' + val('url'));
          if (val('street') || val('city') || val('country')) l.push(`ADR:;;${vEsc(val('street'))};${vEsc(val('city'))};;;${vEsc(val('country'))}`);
          l.push('END:VCARD');
          return l.join('\n');
        },
        email: () => {
          const q = [];
          if (val('subject')) q.push('subject=' + encodeURIComponent(val('subject')));
          if (val('body')) q.push('body=' + encodeURIComponent(val('body')));
          return 'mailto:' + val('to') + (q.length ? '?' + q.join('&') : '');
        },
        sms: () => `SMSTO:${val('number')}:${val('body')}`,
        tel: () => 'tel:' + val('number').replace(/\s+/g, ''),
        geo: () => `geo:${val('lat')},${val('lon')}${val('query') ? '?q=' + encodeURIComponent(val('query')) : ''}`,
      };

      let qType = 'text';
      const draft = {}; // Formularwerte pro Typ merken

      function renderTypeTabs() {
        $('#typeTabs').innerHTML = '';
        Object.keys(FORMS).forEach((k) => {
          const b = document.createElement('button');
          b.textContent = t('t_' + k);
          b.setAttribute('aria-selected', String(k === qType));
          b.addEventListener('click', () => {
            saveDraft();
            qType = k;
            renderTypeTabs();
            renderFields();
            generate();
          });
          $('#typeTabs').appendChild(b);
        });
      }
      function saveDraft() {
        draft[qType] = {};
        $$('#fields [id^="f-"]').forEach((el) => (draft[qType][el.id] = el.type === 'checkbox' ? el.checked : el.value));
      }
      function renderFields() {
        const box = $('#fields');
        box.innerHTML = '';
        FORMS[qType].forEach((f) => {
          const wrap = document.createElement('label');
          wrap.className = f.type === 'checkbox' ? 'check' : 'field' + (f.wide ? ' wide' : '');
          let el;
          if (f.type === 'textarea') {
            el = document.createElement('textarea');
            el.style.minHeight = '110px';
          } else if (f.type === 'select') {
            el = document.createElement('select');
            f.options.forEach(([v, l]) => el.add(new Option(l === '—' ? t('none') : l, v)));
          } else {
            el = document.createElement('input');
            el.type = f.type === 'checkbox' ? 'checkbox' : f.input || 'text';
          }
          el.id = 'f-' + f.id;
          el.spellcheck = false;
          const saved = draft[qType]?.[el.id];
          if (el.type === 'checkbox') el.checked = !!saved;
          else if (f.type === 'select') el.value = saved || f.options[0][0];
          else el.value = saved ?? f.value ?? '';
          el.addEventListener('input', schedule);
          const span = document.createElement('span');
          span.textContent = t('f_' + f.id);
          if (f.type === 'checkbox') wrap.append(el, span);
          else wrap.append(span, el);
          box.appendChild(wrap);
        });
      }
      // #endregion

      // #region Gestaltung + Rendering
      const DEFAULT_STYLE = { fg: '#15120f', bg: '#ffffff', transparent: false, shape: 'square', eye: 'square', ecc: 'M', margin: 4, size: 1024 };
      let style = { ...DEFAULT_STYLE };
      let logoImg = null;
      let current = null; // { qr, text }

      function makeQR(text) {
        const ecc = logoImg ? 'H' : style.ecc;
        const qr = qrcode(0, ecc);
        qr.addData(text, 'Byte');
        qr.make();
        return qr;
      }

      // Punkt-Radius 0.5: kleinere Punkte liest z. B. jsQR nicht mehr zuverlässig
      const DOT_R = 0.5;
      // Liegt (r,c) in einem der drei Finder-Muster (7×7)?
      const inFinder = (r, c, n) => (r < 7 && c < 7) || (r < 7 && c >= n - 7) || (r >= n - 7 && c < 7);

      function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h);
        ctx.fill();
      }

      function drawQR(canvas, qr, px) {
        const n = qr.getModuleCount();
        const m = style.margin;
        const cell = px / (n + 2 * m);
        canvas.width = canvas.height = px;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, px, px);
        if (!style.transparent) {
          ctx.fillStyle = style.bg;
          ctx.fillRect(0, 0, px, px);
        }
        ctx.fillStyle = style.fg;
        const off = m * cell;
        for (let r = 0; r < n; r++)
          for (let c = 0; c < n; c++) {
            if (!qr.isDark(r, c) || inFinder(r, c, n)) continue;
            const x = off + c * cell,
              y = off + r * cell;
            if (style.shape === 'dots') {
              ctx.beginPath();
              ctx.arc(x + cell / 2, y + cell / 2, cell * DOT_R, 0, Math.PI * 2);
              ctx.fill();
            } else if (style.shape === 'rounded') roundRect(ctx, x + cell * 0.04, y + cell * 0.04, cell * 0.92, cell * 0.92, cell * 0.32);
            else ctx.fillRect(x, y, Math.ceil(cell), Math.ceil(cell));
          }
        // Finder-Muster
        [[0, 0], [0, n - 7], [n - 7, 0]].forEach(([r, c]) => {
          const x = off + c * cell,
            y = off + r * cell;
          const rr = style.eye === 'rounded';
          ctx.fillStyle = style.fg;
          roundRect(ctx, x, y, 7 * cell, 7 * cell, rr ? cell * 2 : 0);
          // Loch
          if (style.transparent) ctx.globalCompositeOperation = 'destination-out';
          else ctx.fillStyle = style.bg;
          roundRect(ctx, x + cell, y + cell, 5 * cell, 5 * cell, rr ? cell * 1.4 : 0);
          ctx.globalCompositeOperation = 'source-over';
          ctx.fillStyle = style.fg;
          roundRect(ctx, x + 2 * cell, y + 2 * cell, 3 * cell, 3 * cell, rr ? cell * 0.9 : 0);
        });
        // Logo (max. ~22 % der Fläche)
        if (logoImg) {
          const box = (n * cell) * 0.22;
          const cx = px / 2,
            cy = px / 2;
          const ratio = logoImg.width / logoImg.height;
          const w = ratio >= 1 ? box : box * ratio;
          const h = ratio >= 1 ? box / ratio : box;
          ctx.fillStyle = style.transparent ? '#ffffff' : style.bg;
          roundRect(ctx, cx - w / 2 - cell * 0.6, cy - h / 2 - cell * 0.6, w + cell * 1.2, h + cell * 1.2, cell);
          ctx.drawImage(logoImg, cx - w / 2, cy - h / 2, w, h);
        }
      }

      function svgString(qr) {
        const n = qr.getModuleCount();
        const m = style.margin;
        const total = n + 2 * m;
        const parts = [];
        for (let r = 0; r < n; r++)
          for (let c = 0; c < n; c++) {
            if (!qr.isDark(r, c) || inFinder(r, c, n)) continue;
            const x = c + m,
              y = r + m;
            if (style.shape === 'dots') parts.push(`<circle cx="${x + 0.5}" cy="${y + 0.5}" r="${DOT_R}"/>`);
            else if (style.shape === 'rounded') parts.push(`<rect x="${x + 0.04}" y="${y + 0.04}" width="0.92" height="0.92" rx="0.32"/>`);
            else parts.push(`<rect x="${x}" y="${y}" width="1.02" height="1.02"/>`);
          }
        const rr = style.eye === 'rounded';
        [[0, 0], [0, n - 7], [n - 7, 0]].forEach(([r, c]) => {
          const x = c + m,
            y = r + m;
          parts.push(
            `<path fill-rule="evenodd" d="${rectPath(x, y, 7, rr ? 2 : 0)} ${rectPath(x + 1, y + 1, 5, rr ? 1.4 : 0)}"/>`,
            `<rect x="${x + 2}" y="${y + 2}" width="3" height="3" rx="${rr ? 0.9 : 0}"/>`,
          );
        });
        let logo = '';
        if (logoImg) {
          const box = n * 0.22;
          const ratio = logoImg.width / logoImg.height;
          const w = ratio >= 1 ? box : box * ratio;
          const h = ratio >= 1 ? box / ratio : box;
          const c = document.createElement('canvas');
          c.width = logoImg.width;
          c.height = logoImg.height;
          c.getContext('2d').drawImage(logoImg, 0, 0);
          logo =
            `<rect x="${total / 2 - w / 2 - 0.6}" y="${total / 2 - h / 2 - 0.6}" width="${w + 1.2}" height="${h + 1.2}" rx="1" fill="${style.transparent ? '#ffffff' : style.bg}"/>` +
            `<image href="${c.toDataURL('image/png')}" x="${total / 2 - w / 2}" y="${total / 2 - h / 2}" width="${w}" height="${h}"/>`;
        }
        return (
          `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${total} ${total}" width="${style.size}" height="${style.size}" shape-rendering="${style.shape === 'square' ? 'crispEdges' : 'geometricPrecision'}">` +
          (style.transparent ? '' : `<rect width="100%" height="100%" fill="${style.bg}"/>`) +
          `<g fill="${style.fg}">${parts.join('')}</g>${logo}</svg>`
        );
      }
      function rectPath(x, y, s, r) {
        if (!r) return `M${x} ${y}h${s}v${s}h-${s}z`;
        return `M${x + r} ${y}h${s - 2 * r}a${r} ${r} 0 0 1 ${r} ${r}v${s - 2 * r}a${r} ${r} 0 0 1 -${r} ${r}h-${s - 2 * r}a${r} ${r} 0 0 1 -${r} -${r}v-${s - 2 * r}a${r} ${r} 0 0 1 ${r} -${r}z`;
      }

      // Kontrast nach WCAG (für die Warnung)
      const lum = (hex) => {
        const v = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255).map((c) => (c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4));
        return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
      };

      function verify(canvas) {
        const out = [];
        const lf = lum(style.fg),
          lb = style.transparent ? 1 : lum(style.bg);
        const ratio = (Math.max(lf, lb) + 0.05) / (Math.min(lf, lb) + 0.05);
        if (lf > lb) out.push(`<span class="pill warn">${esc(t('inverted'))}</span>`);
        else if (ratio < 4) out.push(`<span class="pill warn">${esc(t('lowContrast', ratio.toFixed(1)))}</span>`);
        // Echter Test-Scan mit jsQR auf einer kleinen Kopie (auf Weiss gelegt)
        const s = 400;
        const w = $('#work');
        w.width = w.height = s;
        const ctx = w.getContext('2d', { willReadFrequently: true });
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, s, s);
        ctx.drawImage(canvas, 0, 0, s, s);
        const img = ctx.getImageData(0, 0, s, s);
        const res = jsQR(img.data, s, s, { inversionAttempts: 'attemptBoth' });
        const ok = res && res.data === current.text;
        out.unshift(`<span class="pill ${ok ? 'ok' : 'bad'}">${esc(ok ? t('ok') : t('fail'))}</span>`);
        $('#verify').innerHTML = out.join('');
      }

      let timer;
      function schedule() {
        clearTimeout(timer);
        timer = setTimeout(generate, 90);
      }
      function generate() {
        const text = BUILD[qType]();
        const canvas = $('#qrCanvas');
        $('#genMsg').textContent = '';
        if (!text.trim()) {
          current = null;
          canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
          $('#qrInfo').textContent = '';
          $('#verify').innerHTML = `<span class="muted">${esc(t('empty'))}</span>`;
          return;
        }
        try {
          const qr = makeQR(text);
          current = { qr, text };
          drawQR(canvas, qr, 600);
          const n = qr.getModuleCount();
          $('#qrInfo').textContent = t('info', (n - 17) / 4, n) + ' · ' + (logoImg ? 'H' : style.ecc);
          verify(canvas);
        } catch (e) {
          current = null;
          $('#qrInfo').textContent = '';
          $('#verify').innerHTML = '';
          $('#genMsg').className = 'msg bad';
          $('#genMsg').textContent = t('tooLong');
        }
      }

      function fileBase() {
        const text = current ? current.text : 'qr';
        const slug = text.replace(/^[a-z]+:\/*/i, '').replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '').slice(0, 32);
        return 'qr-' + (slug || 'code');
      }
      function exportCanvas() {
        const c = document.createElement('canvas');
        drawQR(c, current.qr, style.size);
        return c;
      }
      $('#dlPng').addEventListener('click', () => {
        if (!current) return;
        exportCanvas().toBlob((b) => download(fileBase() + '.png', b));
      });
      $('#dlSvg').addEventListener('click', () => current && download(fileBase() + '.svg', svgString(current.qr), 'image/svg+xml'));
      $('#copyPng').addEventListener('click', () => {
        if (!current) return;
        exportCanvas().toBlob(async (b) => {
          try {
            await navigator.clipboard.write([new ClipboardItem({ 'image/png': b })]);
            toast(t('copied'));
          } catch (e) {
            toast(t('copyFail'));
          }
        });
      });

      // Stil-Steuerung
      function syncStyleUI() {
        $('#fg').value = $('#fgHex').value = style.fg;
        $('#bg').value = $('#bgHex').value = style.bg;
        $('#transparent').checked = style.transparent;
        $('#margin').value = style.margin;
        $('#marginVal').textContent = style.margin;
        $('#size').value = style.size;
        $('#sizeVal').textContent = style.size + ' px';
        $$('#shapeSeg button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.shape === style.shape)));
        $$('#eyeSeg button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.eye === style.eye)));
        $$('#eccSeg button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.ecc === (logoImg ? 'H' : style.ecc))));
        $('#logoClear').hidden = !logoImg;
        $('#logoNote').textContent = logoImg ? t('logoNote') : '';
      }
      const isHex = (v) => /^#[0-9a-f]{6}$/i.test(v);
      [['fg', 'fgHex'], ['bg', 'bgHex']].forEach(([pick, text]) => {
        $('#' + pick).addEventListener('input', (e) => {
          style[pick] = e.target.value;
          $('#' + text).value = e.target.value;
          schedule();
        });
        $('#' + text).addEventListener('input', (e) => {
          let v = e.target.value.trim();
          if (!v.startsWith('#')) v = '#' + v;
          const ok = isHex(v);
          e.target.classList.toggle('is-bad', !ok);
          if (!ok) return;
          style[pick] = v.toLowerCase();
          $('#' + pick).value = style[pick];
          schedule();
        });
      });
      $('#transparent').addEventListener('change', (e) => {
        style.transparent = e.target.checked;
        schedule();
      });
      $('#margin').addEventListener('input', (e) => {
        style.margin = +e.target.value;
        $('#marginVal').textContent = style.margin;
        schedule();
      });
      $('#size').addEventListener('input', (e) => {
        style.size = +e.target.value;
        $('#sizeVal').textContent = style.size + ' px';
      });
      [['#shapeSeg', 'shape'], ['#eyeSeg', 'eye'], ['#eccSeg', 'ecc']].forEach(([sel, key]) =>
        $$(sel + ' button').forEach((b) =>
          b.addEventListener('click', () => {
            style[key] = b.dataset[key];
            syncStyleUI();
            schedule();
          }),
        ),
      );
      $('#resetStyle').addEventListener('click', () => {
        style = { ...DEFAULT_STYLE };
        logoImg = null;
        syncStyleUI();
        generate();
      });
      $('#logo').addEventListener('change', (e) => {
        const f = e.target.files[0];
        if (!f) return;
        const img = new Image();
        img.onload = () => {
          logoImg = img;
          syncStyleUI();
          generate();
        };
        img.src = URL.createObjectURL(f);
        e.target.value = '';
      });
      $('#logoClear').addEventListener('click', () => {
        logoImg = null;
        syncStyleUI();
        generate();
      });
      // #endregion

      // #region Lesen — Typ-Erkennung und Parser
      function detectType(d) {
        if (/^https?:\/\//i.test(d)) return 'url';
        if (/^mailto:/i.test(d) || /^MATMSG:/i.test(d)) return 'email';
        if (/^tel:/i.test(d)) return 'phone';
        if (/^(sms|smsto):/i.test(d)) return 'sms';
        if (/^WIFI:/i.test(d)) return 'wifi';
        if (/^BEGIN:VCARD/i.test(d)) return 'vcard';
        if (/^MECARD:/i.test(d)) return 'mecard';
        if (/^geo:/i.test(d)) return 'geo';
        if (/^BEGIN:(VEVENT|VCALENDAR)/i.test(d)) return 'event';
        if (/^(bitcoin|ethereum|litecoin):/i.test(d)) return 'crypto';
        if (/^otpauth:/i.test(d)) return 'otp';
        if (/^magnet:/i.test(d)) return 'magnet';
        if (/^SPC\r?\n/.test(d) || /^upi:\/\//i.test(d) || /^bezahlcode:/i.test(d)) return 'payment';
        return 'text';
      }
      const unesc = (s) => s.replace(/\\([\\;,":])/g, '$1');
      const qs = (s) => Object.fromEntries((s || '').split('&').filter(Boolean).map((p) => p.split('=').map((x) => decodeURIComponent((x || '').replace(/\+/g, ' ')))));

      function parse(type, d) {
        const k = t('keys');
        const r = [];
        const add = (key, v) => v && r.push([k[key] || key, v]);
        if (type === 'url') {
          try {
            const u = new URL(d);
            add('protocol', u.protocol.replace(':', ''));
            add('host', u.hostname + (u.port ? ':' + u.port : ''));
            if (u.pathname !== '/') add('path', u.pathname);
            u.searchParams.forEach((v, key) => r.push([key, v]));
            add('hash', u.hash);
          } catch (e) {}
        } else if (type === 'wifi') {
          d.replace(/^WIFI:/i, '')
            .split(/(?<!\\);/)
            .forEach((p) => {
              const m = p.match(/^([A-Z]):(.*)$/i);
              if (!m) return;
              const v = unesc(m[2]);
              ({ S: () => add('ssid', v), P: () => add('password', v), T: () => add('security', v || t('none')), H: () => add('hidden', v === 'true' ? k.yes : k.no) })[m[1].toUpperCase()]?.();
            });
        } else if (type === 'vcard') {
          const map = { FN: 'name', ORG: 'org', TITLE: 'title', TEL: 'phone', EMAIL: 'email', URL: 'url', ADR: 'address', NOTE: 'note' };
          d.split(/\r?\n/).forEach((line) => {
            const m = line.match(/^([A-Z-]+)(?:;[^:]*)?:(.*)$/i);
            if (m && map[m[1].toUpperCase()]) add(map[m[1].toUpperCase()], unesc(m[2]).replace(/^;+|;+$/g, '').replace(/;+/g, ', '));
          });
        } else if (type === 'mecard') {
          const map = { N: 'name', TEL: 'phone', EMAIL: 'email', URL: 'url', ADR: 'address', NOTE: 'note', ORG: 'org' };
          d.replace(/^MECARD:/i, '')
            .split(/(?<!\\);/)
            .forEach((p) => {
              const m = p.match(/^([A-Z]+):(.*)$/i);
              if (m && map[m[1].toUpperCase()]) add(map[m[1].toUpperCase()], unesc(m[2]));
            });
        } else if (type === 'email') {
          const m = d.match(/^mailto:([^?]*)(?:\?(.*))?$/i);
          if (m) {
            add('to', decodeURIComponent(m[1]));
            const q = qs(m[2]);
            add('subject', q.subject);
            add('body', q.body);
          }
        } else if (type === 'sms') {
          const m = d.match(/^(?:sms|smsto):([^?:;]+)(?:[?:;](?:body=)?(.*))?$/i);
          if (m) {
            add('number', m[1]);
            add('body', m[2] ? decodeURIComponent(m[2]) : '');
          }
        } else if (type === 'phone') add('number', d.replace(/^tel:/i, ''));
        else if (type === 'geo') {
          const m = d.match(/^geo:([-\d.]+),([-\d.]+)(?:,[-\d.]+)?(?:\?(.*))?$/i);
          if (m) {
            add('lat', m[1]);
            add('lon', m[2]);
            const q = qs(m[3]);
            add('note', q.q);
          }
        } else if (type === 'otp') {
          try {
            const u = new URL(d);
            add('account', decodeURIComponent(u.pathname.replace(/^\//, '')));
            u.searchParams.forEach((v, key) => r.push([key === 'issuer' ? k.issuer : key, key === 'secret' ? v.slice(0, 4) + '…' : v]));
          } catch (e) {}
        } else if (type === 'crypto') {
          const m = d.match(/^([a-z]+):([^?]+)(?:\?(.*))?$/i);
          if (m) {
            add('currency', m[1]);
            add('account', m[2]);
            const q = qs(m[3]);
            add('amount', q.amount);
          }
        }
        return r;
      }
      // #endregion

      // #region Lesen — Darstellung
      let lastRead = null;
      function showRead(code, source) {
        lastRead = { code, source };
        const d = code.data;
        const type = detectType(d);
        $('#readResult').hidden = false;
        $('#readMsg').textContent = '';
        $('#typeBadge').textContent = t('types')[type];
        $('#srcName').textContent = source.name;
        $('#thumb').src = source.thumb || '';
        $('#thumb').hidden = !source.thumb;

        $('#payload').innerHTML = type === 'url' ? `<a href="${esc(d)}" target="_blank" rel="noopener noreferrer">${esc(d)}</a>` : esc(d);

        const acts = $('#actions');
        acts.innerHTML = '';
        const btn = (label, fn, primary) => {
          const b = document.createElement('button');
          b.className = 'btn' + (primary ? ' primary' : '');
          b.textContent = label;
          b.addEventListener('click', fn);
          acts.appendChild(b);
        };
        const link = (label, href) => {
          const a = document.createElement('a');
          a.className = 'btn primary';
          a.textContent = label;
          a.href = href;
          if (/^https?:/.test(href)) {
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
          }
          acts.appendChild(a);
        };
        btn(t('copy'), () => copy(d));
        if (type === 'url') link(t('open'), d);
        if (type === 'email' && /^mailto:/i.test(d)) link(t('mailTo'), d);
        if (type === 'phone') link(t('call'), d);
        if (type === 'geo') {
          const m = d.match(/^geo:([-\d.]+),([-\d.]+)/i);
          if (m) link(t('map'), `https://www.openstreetmap.org/?mlat=${m[1]}&mlon=${m[2]}#map=16/${m[1]}/${m[2]}`);
        }
        if (type === 'wifi') {
          const p = d.match(/(?:^|;)P:((?:\\.|[^;])*)/i);
          if (p) btn(t('joinWifi'), () => copy(unesc(p[1])), true);
        }

        const bytes = new TextEncoder().encode(d);
        const mode = code.chunks?.[0]?.type || '—';
        $('#readStats').innerHTML = [
          [[...d].length, 's_chars'],
          [bytes.length, 's_bytes'],
          [code.version || '—', 's_version'],
          [mode, 's_mode'],
        ]
          .map(([n, l]) => `<div class="stat"><div class="n">${esc(n)}</div><div class="l">${esc(t(l))}</div></div>`)
          .join('');

        kvList($('#parsed'), parse(type, d));
        const loc = code.location;
        const pt = (p) => `(${Math.round(p.x)}, ${Math.round(p.y)})`;
        kvList($('#tech'), [
          ['type', type],
          ['version', String(code.version)],
          ['chunks', (code.chunks || []).map((c) => c.type).join(', ') || '—'],
          ['ECI', code.chunks?.find((c) => c.type === 'eci')?.assignmentNumber ?? 'UTF-8 (inferred)'],
          ['top-left', loc ? pt(loc.topLeftCorner) : '—'],
          ['top-right', loc ? pt(loc.topRightCorner) : '—'],
          ['bottom-left', loc ? pt(loc.bottomLeftCorner) : '—'],
          ['bottom-right', loc ? pt(loc.bottomRightCorner) : '—'],
        ]);
        const lines = [];
        for (let i = 0; i < bytes.length; i += 16) {
          const s = bytes.slice(i, i + 16);
          lines.push(
            i.toString(16).padStart(6, '0') + '  ' +
              Array.from(s, (b) => b.toString(16).padStart(2, '0')).join(' ').padEnd(48) +
              ' │ ' + Array.from(s, (b) => (b >= 32 && b < 127 ? String.fromCharCode(b) : '·')).join(''),
          );
        }
        $('#hex').textContent = lines.join('\n');
      }
      function kvList(el, rows) {
        el.innerHTML = '';
        rows.forEach(([k, v]) => {
          const a = document.createElement('span');
          a.className = 'k';
          a.textContent = k;
          const b = document.createElement('span');
          b.className = 'v';
          b.textContent = v;
          const c = document.createElement('button');
          c.className = 'btn sm';
          c.textContent = '⧉';
          c.title = t('copy');
          c.addEventListener('click', () => copy(String(v), k));
          el.append(a, b, c);
        });
      }

      function decodeImage(img, name) {
        const maxSide = 1600;
        const scale = Math.min(1, maxSide / Math.max(img.naturalWidth || img.width, img.naturalHeight || img.height));
        const w = Math.round((img.naturalWidth || img.width) * scale);
        const h = Math.round((img.naturalHeight || img.height) * scale);
        const c = $('#work');
        c.width = w;
        c.height = h;
        const ctx = c.getContext('2d', { willReadFrequently: true });
        ctx.fillStyle = '#fff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        let code = jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'attemptBoth' });
        // Zweiter Versuch: kleiner skaliert (hilft bei sehr grossen, verrauschten Fotos)
        if (!code && w > 600) {
          const s2 = 600 / w;
          c.width = 600;
          c.height = Math.round(h * s2);
          ctx.drawImage(img, 0, 0, c.width, c.height);
          code = jsQR(ctx.getImageData(0, 0, c.width, c.height).data, c.width, c.height, { inversionAttempts: 'attemptBoth' });
        }
        if (!code) {
          $('#readMsg').className = 'msg bad';
          $('#readMsg').textContent = t('noCode');
          return;
        }
        showRead(code, { name, thumb: img.src });
      }
      function readFile(f) {
        if (!f || !f.type.startsWith('image/')) return;
        const img = new Image();
        img.onload = () => decodeImage(img, f.name || 'clipboard.png');
        img.src = URL.createObjectURL(f);
      }
      $('#readFile').addEventListener('change', (e) => {
        readFile(e.target.files[0]);
        e.target.value = '';
      });
      const drop = $('#drop');
      ['dragenter', 'dragover'].forEach((ev) => drop.addEventListener(ev, (e) => (e.preventDefault(), drop.classList.add('over'))));
      ['dragleave', 'drop'].forEach((ev) => drop.addEventListener(ev, () => drop.classList.remove('over')));
      drop.addEventListener('drop', (e) => {
        e.preventDefault();
        readFile(e.dataTransfer.files[0]);
      });
      document.addEventListener('paste', (e) => {
        const item = [...(e.clipboardData?.items || [])].find((i) => i.type.startsWith('image/'));
        if (!item) return;
        e.preventDefault();
        setMode('read');
        readFile(item.getAsFile());
      });

      // Kamera
      let stream = null;
      let raf = 0;
      async function startCam() {
        try {
          stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
        } catch (e) {
          $('#readMsg').className = 'msg bad';
          $('#readMsg').textContent = t('camDenied');
          return;
        }
        const v = $('#video');
        v.srcObject = stream;
        await v.play();
        $('#cam').hidden = false;
        const c = document.createElement('canvas');
        const ctx = c.getContext('2d', { willReadFrequently: true });
        let frame = 0;
        const loop = () => {
          raf = requestAnimationFrame(loop);
          if (frame++ % 3 || v.readyState < 2) return; // ~20 Scans/s reichen
          const w = 640;
          const h = Math.round((v.videoHeight / v.videoWidth) * w) || 480;
          c.width = w;
          c.height = h;
          ctx.drawImage(v, 0, 0, w, h);
          const code = jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'dontInvert' });
          if (code && code.data) {
            if (navigator.vibrate) navigator.vibrate(60);
            const thumb = c.toDataURL('image/jpeg', 0.7);
            stopCam();
            showRead(code, { name: t('liveCam'), thumb });
          }
        };
        loop();
      }
      function stopCam() {
        cancelAnimationFrame(raf);
        if (stream) stream.getTracks().forEach((tr) => tr.stop());
        stream = null;
        $('#cam').hidden = true;
      }
      $('#camBtn').addEventListener('click', startCam);
      $('#camClose').addEventListener('click', stopCam);

      // Gelesenen Inhalt als neuen Code übernehmen
      $('#toCreate').addEventListener('click', () => {
        if (!lastRead) return;
        draft.text = { 'f-text': lastRead.code.data };
        qType = 'text';
        setMode('create');
        renderTypeTabs();
        renderFields();
        generate();
      });
      // #endregion

      // #region Modus
      function setMode(m) {
        $$('#modeTabs [data-mode]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.mode === m)));
        $('#view-create').hidden = m !== 'create';
        $('#view-read').hidden = m !== 'read';
        if (m !== 'read') stopCam();
        try {
          history.replaceState(null, '', m === 'read' ? '#read' : location.pathname + location.search);
        } catch (e) {}
      }
      $$('#modeTabs [data-mode]').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));
      // #endregion

      TV.init({
        glyph: '▦',
        strings: STRINGS,
        onLang: () => {
          saveDraft();
          renderTypeTabs();
          renderFields();
          syncStyleUI();
          generate();
          if (lastRead && !$('#readResult').hidden) showRead(lastRead.code, lastRead.source);
        },
      });
      syncStyleUI();
      setMode(location.hash === '#read' ? 'read' : 'create');
    </script>
  </body>
</html>
