<!doctype html>
<html lang="en" data-theme="black">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Colour vision helper: name any colour in a photo or the live camera, simulate colour blindness, enhance images for colour-vision deficiency and check whether two colours can be told apart."
    />
    <title>Color Vision · ToolVault</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Montserrat:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../shared/tv.css?v=3.4.1" />
    <script src="../shared/tv.js?v=3.4.1"></script>
    <script src="../shared/color.js?v=3.4.1"></script>

    <style>
      .source-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .stage {
        position: relative;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        overflow: hidden;
        min-height: 260px;
        display: grid;
        place-items: center;
      }
      .stage.drag {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .stage canvas {
        display: block;
        max-width: 100%;
        max-height: 70vh;
        height: auto;
        touch-action: none;
      }
      .stage canvas.pick {
        cursor: crosshair;
      }
      .stage .empty {
        text-align: center;
        color: var(--text-muted);
        padding: 30px 16px;
        font-size: 0.9rem;
      }
      .stage .empty b {
        display: block;
        font-size: 1.6rem;
        color: var(--text);
        margin-bottom: 6px;
      }
      .reticle {
        position: absolute;
        width: 34px;
        height: 34px;
        border: 3px solid #fff;
        border-radius: 50%;
        box-shadow:
          0 0 0 2px #000,
          inset 0 0 0 2px #000;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }
      .split-line {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 2px;
        background: #fff;
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.5);
        pointer-events: none;
      }
      .split-tag {
        position: absolute;
        top: 8px;
        font-family: var(--mono);
        font-size: 0.68rem;
        padding: 2px 7px;
        border-radius: 5px;
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
        pointer-events: none;
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 14px;
        align-items: start;
      }
      .layout > .box {
        margin-top: 0;
      }
      .layout > aside.stack {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .layout > aside.stack > .box {
        margin-top: 0;
      }
      .ident {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .ident .sw {
        height: 110px;
        border-radius: 12px;
        border: 1px solid var(--border);
      }
      .ident .desc {
        font-size: 1.45rem;
        font-weight: 600;
        line-height: 1.2;
      }
      .ident .desc::first-letter {
        text-transform: uppercase;
      }
      .nrow {
        display: grid;
        grid-template-columns: 6.8em 1fr;
        gap: 8px;
        font-size: 0.86rem;
        align-items: baseline;
      }
      .nrow .k {
        font-family: var(--mono);
        font-size: 0.66rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-muted);
      }
      .dot {
        display: inline-block;
        width: 13px;
        height: 13px;
        border-radius: 4px;
        border: 1px solid var(--border);
        vertical-align: -2px;
        margin-right: 6px;
      }
      .history {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 6px;
      }
      .history li {
        display: grid;
        grid-template-columns: 26px 1fr auto;
        gap: 10px;
        align-items: center;
        font-size: 0.82rem;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 9px;
        padding: 6px 8px;
        cursor: pointer;
      }
      .history li span:first-child {
        width: 26px;
        height: 26px;
        border-radius: 6px;
        border: 1px solid var(--border);
      }
      .history .hx {
        font-family: var(--mono);
        font-size: 0.7rem;
        color: var(--text-muted);
      }
      .grid4 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .grid4 figure {
        margin: 0;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        overflow: hidden;
      }
      .grid4 canvas {
        width: 100%;
        height: auto;
        display: block;
      }
      .grid4 figcaption {
        font-family: var(--mono);
        font-size: 0.72rem;
        padding: 6px 10px;
        color: var(--text-muted);
      }
      .ctrl {
        display: grid;
        grid-template-columns: 7.5em 1fr 3.5em;
        gap: 10px;
        align-items: center;
        font-size: 0.84rem;
        color: var(--text-muted);
      }
      .ctrl + .ctrl {
        margin-top: 10px;
      }
      .ctrl .val {
        font-family: var(--mono);
        font-size: 0.78rem;
        text-align: right;
        color: var(--text);
      }
      /* Farbpaar */
      .pair-in {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .pair-in .row input[type='color'] {
        width: 42px;
        height: 38px;
        padding: 2px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg);
      }
      .pair-row {
        display: grid;
        grid-template-columns: 10.5em 120px minmax(0, 1fr);
        gap: 12px;
        align-items: center;
        padding: 8px 0;
        border-top: 1px solid var(--border);
        font-size: 0.84rem;
      }
      .pair-row .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        height: 38px;
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid var(--border);
      }
      .bar {
        height: 8px;
        border-radius: 4px;
        background: var(--surface-2);
        overflow: hidden;
        margin-top: 4px;
      }
      .bar span {
        display: block;
        height: 100%;
      }
      /* Tab-Erklärung */
      .tabinfo {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        background: var(--surface);
        border: 1px solid var(--border);
        border-left: 3px solid var(--accent);
        border-radius: 0 12px 12px 0;
        padding: 12px 16px;
        margin: 0 0 14px;
        font-size: 0.88rem;
        color: var(--text-muted);
      }
      .tabinfo b {
        color: var(--text);
      }
      .tabinfo .ico {
        font-size: 1.3rem;
        line-height: 1.2;
      }
      /* Sehtest */
      .test {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: 24px;
        align-items: center;
      }
      .plate-wrap {
        position: relative;
        width: min(100%, 420px);
        aspect-ratio: 1;
        margin: 0 auto;
      }
      .plate-wrap canvas {
        width: 100%;
        height: 100%;
        display: block;
        border-radius: 50%;
        box-shadow: 0 0 0 6px var(--surface-2), 0 0 0 7px var(--border);
      }
      .plate-num {
        position: absolute;
        top: -4px;
        left: -4px;
        font-family: var(--mono);
        font-size: 0.72rem;
        background: var(--text);
        color: var(--bg);
        border-radius: 999px;
        padding: 3px 9px;
      }
      .q {
        font-size: 1.15rem;
        font-weight: 600;
        margin: 0 0 4px;
      }
      .choices {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        margin-top: 16px;
      }
      .choice {
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 16px;
        color: var(--text);
        cursor: pointer;
        padding: 14px;
        transition:
          transform 0.2s cubic-bezier(0.22, 1, 0.36, 1),
          border-color 0.2s ease,
          background 0.2s ease;
      }
      .choice svg {
        width: 70%;
        height: 70%;
      }
      .choice:hover {
        transform: translateY(-3px);
        border-color: var(--accent);
        color: var(--accent);
      }
      .choice.none {
        font-family: var(--mono);
        font-size: 0.76rem;
        line-height: 1.3;
        text-align: center;
        color: var(--text-muted);
      }
      .test-progress {
        height: 6px;
        border-radius: 4px;
        background: var(--surface-2);
        overflow: hidden;
        margin-top: 18px;
      }
      .test-progress span {
        display: block;
        height: 100%;
        background: var(--accent);
        transition: width 0.3s ease;
      }
      .tips {
        margin: 12px 0 0;
        padding-left: 18px;
        color: var(--text-muted);
        font-size: 0.86rem;
      }
      .tips li + li {
        margin-top: 4px;
      }
      .verdict {
        display: flex;
        gap: 16px;
        align-items: center;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 18px;
      }
      .verdict .big {
        font-size: 2.6rem;
        line-height: 1;
      }
      .verdict h3 {
        margin: 0 0 4px;
        font-size: 1.2rem;
      }
      .verdict p {
        margin: 0;
        color: var(--text-muted);
        font-size: 0.9rem;
      }
      .scores {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 10px;
        margin-top: 14px;
      }
      .score {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 0.84rem;
      }
      .score .n {
        font-family: var(--mono);
        font-weight: 700;
        font-size: 1.1rem;
      }
      .review {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
        gap: 10px;
        margin-top: 14px;
      }
      .review figure {
        margin: 0;
        text-align: center;
        font-size: 0.7rem;
        color: var(--text-muted);
      }
      .review img {
        width: 100%;
        border-radius: 50%;
        display: block;
        margin-bottom: 4px;
      }
      .review .ans {
        display: flex;
        justify-content: center;
        gap: 4px;
        align-items: center;
      }
      .review .ans svg {
        width: 16px;
        height: 16px;
      }
      @media (max-width: 860px) {
        .layout {
          grid-template-columns: 1fr;
        }
        .test {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 560px) {
        .pair-in {
          grid-template-columns: 1fr;
        }
        .pair-row {
          grid-template-columns: 1fr 90px;
        }
        .pair-row > :last-child {
          grid-column: 1 / -1;
        }
        .grid4 {
          grid-template-columns: 1fr;
        }
      }
    </style>
      <link rel="stylesheet" href="../shared/fx.css?v=3.4.1" />
      <script src="../shared/fx.js?v=3.4.1"></script>
  </head>

  <body>
    <div class="wrap">
      <header class="topbar">
        <a class="wordmark" href="../index.html"
          ><span class="prompt">~/</span><span class="hub">ToolVault</span
          ><span class="prompt">/</span><span class="tool">vision</span></a
        >
        <div class="topbar-right">
          <div class="themes" id="themes" role="group" aria-label="Theme"></div>
          <div class="lang" id="lang" role="group" aria-label="Language">
            <button data-lang="de">DE</button><span class="divider" aria-hidden="true">·</span
            ><button data-lang="en">EN</button>
          </div>
        </div>
      </header>

      <section class="hero">
        <p class="kicker" data-i18n="kicker"></p>
        <h1 data-i18n-html="title"></h1>
        <p data-i18n="lead"></p>
      </section>

      <div class="seg" role="tablist" id="modeTabs" style="margin-bottom: 14px">
        <button role="tab" data-mode="identify" aria-selected="true" data-i18n="m_identify"></button>
        <button role="tab" data-mode="test" aria-selected="false" data-i18n="m_test"></button>
        <button role="tab" data-mode="simulate" aria-selected="false" data-i18n="m_simulate"></button>
        <button role="tab" data-mode="enhance" aria-selected="false" data-i18n="m_enhance"></button>
        <button role="tab" data-mode="pair" aria-selected="false" data-i18n="m_pair"></button>
      </div>

      <p class="tabinfo" id="tabInfo"><span class="ico" id="tabIco"></span><span id="tabText"></span></p>

      <!-- Sehtest -->
      <section id="view-test" hidden>
        <div class="box" id="testIntro">
          <h2 class="box-title"><span data-i18n="testTitle"></span></h2>
          <div class="test">
            <div class="plate-wrap"><canvas id="demoPlate" width="840" height="840"></canvas></div>
            <div>
              <p class="q" data-i18n="testHow"></p>
              <p class="muted" style="margin: 0" data-i18n="testHowText"></p>
              <ul class="tips">
                <li data-i18n="tip1"></li>
                <li data-i18n="tip2"></li>
                <li data-i18n="tip3"></li>
              </ul>
              <button class="btn primary" id="testStart" style="margin-top: 16px" data-i18n="testStart"></button>
            </div>
          </div>
        </div>

        <div class="box" id="testRun" hidden>
          <div class="test">
            <div class="plate-wrap">
              <canvas id="plate" width="840" height="840" aria-label="Test plate"></canvas>
              <span class="plate-num" id="plateNum"></span>
            </div>
            <div>
              <p class="q" data-i18n="testQ"></p>
              <p class="muted" style="margin: 0; font-size: 0.86rem" data-i18n="testQHint"></p>
              <div class="choices" id="choices"></div>
              <div class="test-progress"><span id="testBar"></span></div>
            </div>
          </div>
        </div>

        <div class="box" id="testResult" hidden>
          <h2 class="box-title"><span data-i18n="resultTitle"></span><button class="btn sm" id="testAgain" data-i18n="testAgain"></button></h2>
          <div class="verdict" id="verdict"></div>
          <div class="scores" id="scores"></div>
          <div class="row" style="margin-top: 14px" id="resultActions"></div>
          <h2 class="box-title" style="margin-top: 18px"><span data-i18n="reviewTitle"></span></h2>
          <div class="review" id="review"></div>
          <p class="muted" style="font-size: 0.78rem; margin: 14px 0 0" data-i18n="disclaimer"></p>
        </div>
      </section>

      <!-- Bild-Modi -->
      <section id="view-image" class="layout">
        <div class="box">
          <div class="source-bar" style="margin-bottom: 12px">
            <label class="btn primary" style="position: relative"
              ><span data-i18n="upload"></span
              ><input type="file" id="file" accept="image/*" style="position: absolute; inset: 0; opacity: 0; cursor: pointer"
            /></label>
            <button class="btn" id="camBtn" data-i18n="camera"></button>
            <button class="btn" id="freeze" hidden data-i18n="freeze"></button>
            <button class="btn" id="sample" data-i18n="sample"></button>
            <span class="spacer"></span>
            <span class="tiny muted mono" style="font-size: 0.72rem" data-i18n="pasteHint"></span>
          </div>
          <div class="stage" id="stage">
            <div class="empty" id="empty"><b>👁</b><span data-i18n="emptyText"></span></div>
            <canvas id="view" hidden></canvas>
            <div class="reticle" id="reticle" hidden></div>
            <div class="split-line" id="splitLine" hidden></div>
            <span class="split-tag" id="tagL" hidden style="left: 8px"></span>
            <span class="split-tag" id="tagR" hidden style="right: 8px"></span>
          </div>
          <div class="grid4" id="grid4" hidden style="margin-top: 12px"></div>
          <video id="video" playsinline muted hidden></video>
        </div>

        <aside class="stack">
          <!-- Erkennen -->
          <div class="box" data-for="identify">
            <h2 class="box-title"><span data-i18n="picked"></span></h2>
            <div class="ident" id="ident">
              <div class="sw" id="idSw"></div>
              <div class="desc" id="idDesc"></div>
              <div class="nrow"><span class="k" data-i18n="nameBasic"></span><span id="idBasic"></span></div>
              <div class="nrow"><span class="k" data-i18n="nameDb"></span><span id="idDb"></span></div>
              <div class="nrow"><span class="k">HEX / RGB</span><span class="mono" id="idHex"></span></div>
              <div class="row">
                <button class="btn sm" id="idCopy" data-i18n="copyHex"></button>
                <a class="btn sm" id="idOpen" data-i18n="openColor"></a>
              </div>
            </div>
          </div>
          <div class="box" data-for="identify">
            <h2 class="box-title"><span data-i18n="history"></span><button class="btn sm" id="clearHist" data-i18n="clear"></button></h2>
            <ul class="history" id="history"></ul>
          </div>

          <!-- Simulieren -->
          <div class="box" data-for="simulate" hidden>
            <h2 class="box-title"><span data-i18n="simType"></span></h2>
            <div class="seg" id="simType" style="margin-bottom: 12px"></div>
            <div class="ctrl">
              <span data-i18n="severity"></span>
              <input type="range" id="severity" min="10" max="100" value="100" />
              <span class="val" id="sevVal">100%</span>
            </div>
            <div class="field" style="margin-top: 12px; font-size: 0.84rem; color: var(--text-muted)">
              <span data-i18n="view"></span>
              <span class="seg" id="simView">
                <button data-v="split" aria-selected="true" data-i18n="v_split"></button>
                <button data-v="full" aria-selected="false" data-i18n="v_full"></button>
                <button data-v="all" aria-selected="false" data-i18n="v_all"></button>
              </span>
            </div>
            <p class="tiny muted" style="font-size: 0.78rem; margin: 12px 0 0" id="simInfo"></p>
          </div>

          <!-- Verstärken -->
          <div class="box" data-for="enhance" hidden>
            <h2 class="box-title"><span data-i18n="enhType"></span></h2>
            <div class="seg" id="enhType" style="margin-bottom: 12px"></div>
            <div class="ctrl">
              <span data-i18n="strength"></span>
              <input type="range" id="strength" min="0" max="200" value="100" />
              <span class="val" id="strVal">100%</span>
            </div>
            <div class="row" style="margin-top: 12px">
              <button class="btn sm" id="dlEnh" data-i18n="download"></button>
            </div>
            <p class="tiny muted" style="font-size: 0.78rem; margin: 12px 0 0" data-i18n="enhNote"></p>
          </div>
        </aside>
      </section>

      <!-- Farbpaar -->
      <section id="view-pair" hidden>
        <div class="box">
          <h2 class="box-title"><span data-i18n="pairTitle"></span><button class="btn sm" id="pairSwap">⇄</button></h2>
          <div class="pair-in">
            <label class="field"><span data-i18n="colorA"></span><span class="row" style="flex-wrap: nowrap"><input type="color" id="pa" value="#c0392b" /><input type="text" id="paHex" value="#c0392b" spellcheck="false" /></span></label>
            <label class="field"><span data-i18n="colorB"></span><span class="row" style="flex-wrap: nowrap"><input type="color" id="pb" value="#27ae60" /><input type="text" id="pbHex" value="#27ae60" spellcheck="false" /></span></label>
          </div>
          <div class="row" style="margin-top: 10px" id="pairPresets"></div>
          <div id="pairOut" style="margin-top: 14px"></div>
          <p class="tiny muted" style="font-size: 0.78rem; margin: 12px 0 0" data-i18n="pairNote"></p>
        </div>
      </section>

      <footer class="footer">
        <a href="../index.html">← ToolVault</a><span>·</span><span>Color Vision v1.1</span><span>·</span
        ><span data-i18n="local"></span><span>·</span><span id="tv-year"></span>
      </footer>
    </div>

    <canvas id="src" hidden></canvas>

    <script>
      const STRINGS = {
        de: {
          pageTitle: 'Farbsehen',
          kicker: '// farbsehen · erkennen · sehtest · simulieren',
          title: 'Farben <span class="accent">benennen</span>, die du nicht sicher siehst.',
          lead: 'Tippe in ein Foto oder halte die Kamera auf etwas – das Tool sagt dir, welche Farbe es ist. Dazu: ein Farbsehtest, Farbschwäche simulieren, Bilder für Farbschwache verstärken und prüfen, ob zwei Farben unterscheidbar sind.',
          m_identify: '◎ Erkennen',
          m_test: '◈ Sehtest',
          info_identify: '<b>Erkennen:</b> Foto laden oder Kamera starten und irgendwo hineintippen – du bekommst den Namen der Farbe an dieser Stelle. Praktisch beim Einkaufen, Kleider aussuchen oder bei Diagrammen.',
          info_test: '<b>Sehtest:</b> 12 Tafeln mit versteckten Symbolen. Aus deinen Antworten schätzt das Tool, ob und welche Farbschwäche du hast.',
          info_simulate: '<b>Simulieren:</b> zeigt ein Bild so, wie es Menschen mit Farbschwäche sehen – zum Vergleichen mit dem Original (Regler im Bild ziehen).',
          info_enhance: '<b>Verstärken:</b> färbt ein Bild so um, dass Farbunterschiede, die du nicht siehst, sichtbar werden. Sieht ungewohnt aus, hilft aber z. B. bei Karten und Grafiken.',
          info_pair: '<b>Farbpaar prüfen:</b> zwei Farben eingeben und sehen, ob sie für jede Art des Farbsehens unterscheidbar bleiben – z. B. für Diagramme, Ampeln oder Kabelfarben.',
          testTitle: 'Farbsehtest',
          testHow: 'So funktioniert’s',

      const { $, $$, t, esc, copy, download } = TV;
      const C = TVColor;
      const TYPES = C.TYPES; // protan, deutan, tritan, achroma

      // #region Zustand
      let mode = 'identify';
      let simType = 'deutan';
      let enhType = 'deutan';
      let simView = 'split';
      let split = 0.5;
      let hasImage = false;
      let camOn = false;
      let frozen = false;
      let lastPick = null; // { x, y } in Quellkoordinaten
      const src = $('#src');
      const sctx = src.getContext('2d', { willReadFrequently: true });
      const view = $('#view');
      const vctx = view.getContext('2d', { willReadFrequently: true });
      // #endregion

      // #region Quelle laden
      function loadBitmap(img, w, h) {
        const max = 1600;
        const s = Math.min(1, max / Math.max(w, h));
        src.width = Math.round(w * s);
        src.height = Math.round(h * s);
        sctx.drawImage(img, 0, 0, src.width, src.height);
        hasImage = true;
        lastPick = null;
        $('#empty').hidden = true;
        view.hidden = false;
        render();
        if (mode === 'identify') pickAt(src.width / 2, src.height / 2, true);
      }
      function loadFile(f) {
        if (!f || !f.type.startsWith('image/')) return;
        stopCam();
        const img = new Image();
        img.onload = () => loadBitmap(img, img.naturalWidth, img.naturalHeight);
        img.src = URL.createObjectURL(f);
      }
      $('#file').addEventListener('change', (e) => {
        loadFile(e.target.files[0]);
        e.target.value = '';
      });
      const stage = $('#stage');
      ['dragenter', 'dragover'].forEach((ev) => stage.addEventListener(ev, (e) => (e.preventDefault(), stage.classList.add('drag'))));
      ['dragleave', 'drop'].forEach((ev) => stage.addEventListener(ev, () => stage.classList.remove('drag')));
      stage.addEventListener('drop', (e) => {
        e.preventDefault();
        loadFile(e.dataTransfer.files[0]);
      });
      document.addEventListener('paste', (e) => {
        const item = [...(e.clipboardData?.items || [])].find((i) => i.type.startsWith('image/'));
        if (item) {
          e.preventDefault();
          loadFile(item.getAsFile());
        }
      });

      // Testbild: typische Problemfarben + Spektrum
      $('#sample').addEventListener('click', () => {
        stopCam();
        const c = document.createElement('canvas');
        c.width = 1200;
        c.height = 800;
        const g = c.getContext('2d');
        const sp = g.createLinearGradient(0, 0, 1200, 0);
        for (let i = 0; i <= 12; i++) sp.addColorStop(i / 12, `hsl(${i * 30}, 90%, 50%)`);
        g.fillStyle = sp;
        g.fillRect(0, 0, 1200, 200);
        const sp2 = g.createLinearGradient(0, 200, 0, 260);
        sp2.addColorStop(0, 'rgba(255,255,255,0)');
        g.fillStyle = '#fff';
        const cols = ['#c0392b', '#27ae60', '#8b4513', '#e67e22', '#f1c40f', '#6b8e23', '#2980b9', '#8e44ad', '#ff69b4', '#808080', '#008080', '#556b2f'];
        cols.forEach((col, i) => {
          const x = (i % 6) * 200,
            y = 220 + Math.floor(i / 6) * 290;
          g.fillStyle = col;
          g.beginPath();
          g.arc(x + 100, y + 135, 110, 0, Math.PI * 2);
          g.fill();
        });
        loadBitmap(c, c.width, c.height);
      });
      // #endregion

      // #region Kamera
      let stream = null;
      let raf = 0;
      async function startCam() {
        try {
          stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 } }, audio: false });
        } catch (e) {
          TV.toast(t('camDenied'));
          return;
        }
        const v = $('#video');
        v.srcObject = stream;
        await v.play();
        camOn = true;
        frozen = false;
        $('#freeze').hidden = false;
        updateCamButtons();
        let frame = 0;
        const loop = () => {
          raf = requestAnimationFrame(loop);
          if (frozen || v.readyState < 2 || frame++ % 2) return;
          const w = 720;
          const h = Math.round((v.videoHeight / v.videoWidth) * w) || 540;
          if (src.width !== w || src.height !== h) {
            src.width = w;
            src.height = h;
          }
          sctx.drawImage(v, 0, 0, w, h);
          hasImage = true;
          $('#empty').hidden = true;
          view.hidden = false;
          render();
          if (mode === 'identify') pickAt(w / 2, h / 2, false);
        };
        loop();
      }
      function stopCam() {
        cancelAnimationFrame(raf);
        if (stream) stream.getTracks().forEach((tr) => tr.stop());
        stream = null;
        camOn = false;
        $('#freeze').hidden = true;
        updateCamButtons();
      }
      function updateCamButtons() {
        $('#camBtn').textContent = t(camOn ? 'stopCam' : 'camera');
        $('#freeze').textContent = t(frozen ? 'unfreeze' : 'freeze');
      }
      $('#camBtn').addEventListener('click', () => (camOn ? stopCam() : startCam()));
      $('#freeze').addEventListener('click', () => {
        frozen = !frozen;
        updateCamButtons();
        // Beim Anhalten: Verlauf um die aktuelle Farbe ergänzen
        if (frozen && current) addHistory(current);
      });
      // #endregion

      // #region Darstellung
      function processed(type, kind) {
        const img = sctx.getImageData(0, 0, src.width, src.height);
        if (kind === 'enhance') C.daltonizeImageData(img, type, +$('#strength').value / 100);
        else C.simulateImageData(img, type, kind === 'simulate' ? +$('#severity').value / 100 : 1);
        return img;
      }
      function render() {
        if (!hasImage) return;
        view.width = src.width;
        view.height = src.height;
        $('#grid4').hidden = true;
        $('#splitLine').hidden = $('#tagL').hidden = $('#tagR').hidden = true;
        view.classList.toggle('pick', mode === 'identify' || ((mode === 'simulate' && simView === 'split') || mode === 'enhance'));

        if (mode === 'identify') {
          vctx.drawImage(src, 0, 0);
        } else if (mode === 'simulate' && simView === 'all') {
          vctx.drawImage(src, 0, 0);
          renderGrid();
        } else {
          const kind = mode === 'enhance' ? 'enhance' : 'simulate';
          const type = mode === 'enhance' ? enhType : simType;
          const out = processed(type, kind);
          if ((mode === 'simulate' && simView === 'split') || mode === 'enhance') {
            vctx.drawImage(src, 0, 0);
            const sx = Math.round(src.width * split);
            vctx.putImageData(out, 0, 0, sx, 0, src.width - sx, src.height);
            showSplit(kind === 'enhance' ? t('enhanced') : t('n_' + type));
          } else vctx.putImageData(out, 0, 0);
        }
        positionReticle();
      }
      function showSplit(rightLabel) {
        const r = view.getBoundingClientRect(),
          sr = stage.getBoundingClientRect();
        const line = $('#splitLine');
        line.hidden = false;
        line.style.left = r.left - sr.left + r.width * split + 'px';
        line.style.top = r.top - sr.top + 'px';
        line.style.bottom = 'auto';
        line.style.height = r.height + 'px';
        $('#tagL').hidden = $('#tagR').hidden = false;
        $('#tagL').textContent = t('original');
        $('#tagR').textContent = rightLabel;
      }
      function renderGrid() {
        const box = $('#grid4');
        box.hidden = false;
        box.innerHTML = '';
        // kleinere Version für die 4er-Ansicht
        const s = Math.min(1, 640 / src.width);
        const w = Math.round(src.width * s),
          h = Math.round(src.height * s);
        const tmp = document.createElement('canvas');
        tmp.width = w;
        tmp.height = h;
        const tctx = tmp.getContext('2d', { willReadFrequently: true });
        TYPES.forEach((type) => {
          tctx.drawImage(src, 0, 0, w, h);
          const img = C.simulateImageData(tctx.getImageData(0, 0, w, h), type, +$('#severity').value / 100);
          const c = document.createElement('canvas');
          c.width = w;
          c.height = h;
          c.getContext('2d').putImageData(img, 0, 0);
          const fig = document.createElement('figure');
          fig.appendChild(c);
          const cap = document.createElement('figcaption');
          cap.textContent = t('n_' + type);
          fig.appendChild(cap);
          box.appendChild(fig);
        });
      }
      window.addEventListener('resize', () => hasImage && render());
      // #endregion

      // #region Farbe wählen
      let current = null;
      function sampleAt(x, y, r) {
        x = Math.max(r, Math.min(src.width - r - 1, Math.round(x)));
        y = Math.max(r, Math.min(src.height - r - 1, Math.round(y)));
        const d = sctx.getImageData(x - r, y - r, 2 * r + 1, 2 * r + 1).data;
        let R = 0,
          G = 0,
          B = 0,
          n = 0;
        for (let i = 0; i < d.length; i += 4) {
          R += d[i];
          G += d[i + 1];
          B += d[i + 2];
          n++;
        }
        return { r: R / n, g: G / n, b: B / n };
      }
      function pickAt(x, y, remember) {
        lastPick = { x, y };
        const c = sampleAt(x, y, camOn ? 6 : 2);
        current = c;
        showColor(c);
        positionReticle();
        if (remember) addHistory(c);
      }
      function nameHtml(n) {
        return `<span class="dot" style="background:${n.hex}"></span>${esc(n.name)} <span class="mono muted" style="font-size:.7rem">${esc(t('approx', n.dE))}</span>`;
      }
      function showColor(c) {
        const hex = C.rgbToHex(c).toUpperCase();
        $('#idSw').style.background = hex;
        $('#idDesc').textContent = C.describe(c, TV.lang);
        $('#idBasic').innerHTML = nameHtml(C.basicName(c, TV.lang));
        const db = C.namedColor(c);
        $('#idDb').innerHTML = db ? nameHtml(db) : '…';
        $('#idHex').textContent = `${hex} · ${Math.round(c.r)}, ${Math.round(c.g)}, ${Math.round(c.b)}`;
        $('#idOpen').href = '../color/color.html#' + hex.slice(1);
      }
      function positionReticle() {
        const ret = $('#reticle');
        if (mode !== 'identify' || !lastPick || !hasImage) return (ret.hidden = true);
        const r = view.getBoundingClientRect(),
          sr = stage.getBoundingClientRect();
        ret.hidden = false;
        ret.style.left = r.left - sr.left + (lastPick.x / src.width) * r.width + 'px';
        ret.style.top = r.top - sr.top + (lastPick.y / src.height) * r.height + 'px';
      }
      const toSrc = (e) => {
        const r = view.getBoundingClientRect();
        return { x: ((e.clientX - r.left) / r.width) * src.width, y: ((e.clientY - r.top) / r.height) * src.height, fx: (e.clientX - r.left) / r.width };
      };
      let dragging = false;
      view.addEventListener('pointerdown', (e) => {
        dragging = true;
        view.setPointerCapture(e.pointerId);
        handlePointer(e, true);
      });
      view.addEventListener('pointermove', (e) => dragging && handlePointer(e, false));
      view.addEventListener('pointerup', (e) => {
        if (dragging && mode === 'identify' && current) addHistory(current);
        dragging = false;
      });
      function handlePointer(e) {
        const p = toSrc(e);
        if (mode === 'identify') {
          if (camOn && !frozen) {
            frozen = true;
            updateCamButtons();
          }
          pickAt(p.x, p.y, false);
        } else if ((mode === 'simulate' && simView === 'split') || mode === 'enhance') {
          split = Math.max(0, Math.min(1, p.fx));
          render();
        }
      }

      const hist = [];
      function addHistory(c) {
        const hex = C.rgbToHex(c).toUpperCase();
        if (hist[0] && hist[0].hex === hex) return;
        hist.unshift({ hex, c });
        hist.length = Math.min(hist.length, 10);
        renderHistory();
      }
      function renderHistory() {
        $('#history').innerHTML = '';
        hist.forEach((h) => {
          const li = document.createElement('li');
          li.innerHTML = `<span style="background:${h.hex}"></span><span>${esc(C.describe(h.c, TV.lang))}<br><span class="hx">${h.hex} · ${esc(C.basicName(h.c, TV.lang).name)}</span></span><span class="hx">⧉</span>`;
          li.addEventListener('click', () => {
            showColor(h.c);
            copy(h.hex);
          });
          $('#history').appendChild(li);
        });
      }
      $('#clearHist').addEventListener('click', () => {
        hist.length = 0;
        renderHistory();
      });
      $('#idCopy').addEventListener('click', () => current && copy(C.rgbToHex(current).toUpperCase()));
      // #endregion

      // #region Simulieren / Verstärken: Steuerung
      function typeSeg(el, getter, setter) {
        el.innerHTML = '';
        TYPES.forEach((type) => {
          const b = document.createElement('button');
          b.textContent = t(type);
          b.title = t('n_' + type);
          b.setAttribute('aria-selected', String(getter() === type));
          b.addEventListener('click', () => {
            setter(type);
            renderControls();
            render();
          });
          el.appendChild(b);
        });
      }
      function renderControls() {
        typeSeg($('#simType'), () => simType, (v) => (simType = v));
        // Achromatopsie lässt sich nicht sinnvoll verstärken
        typeSeg($('#enhType'), () => enhType, (v) => (enhType = v === 'achroma' ? 'deutan' : v));
        $('#enhType').lastChild.disabled = true;
        $('#simInfo').textContent = t('info_' + simType);
        $$('#simView button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.v === simView)));
        $('#sevVal').textContent = $('#severity').value + '%';
        $('#strVal').textContent = $('#strength').value + '%';
      }
      $$('#simView button').forEach((b) =>
        b.addEventListener('click', () => {
          simView = b.dataset.v;
          renderControls();
          render();
        }),
      );
      $('#severity').addEventListener('input', () => {
        renderControls();
        render();
      });
      $('#strength').addEventListener('input', () => {
        renderControls();
        render();
      });
      $('#dlEnh').addEventListener('click', () => {
        if (!hasImage) return;
        const c = document.createElement('canvas');
        c.width = src.width;
        c.height = src.height;
        c.getContext('2d').putImageData(processed(enhType, 'enhance'), 0, 0);
        c.toBlob((b) => download('enhanced-' + enhType + '.png', b));
      });
      // #endregion

      // #region Farbpaar
      const PAIRS = [
        ['#c0392b', '#27ae60'],
        ['#8b4513', '#556b2f'],
        ['#e67e22', '#9acd32'],
        ['#2980b9', '#8e44ad'],
        ['#ff69b4', '#a0a0a0'],
        ['#008080', '#808080'],
      ];
      function renderPair() {
        const a = C.hexToRgb($('#paHex').value),
          b = C.hexToRgb($('#pbHex').value);
        $('#paHex').classList.toggle('is-bad', !a);
        $('#pbHex').classList.toggle('is-bad', !b);
        if (!a || !b) return;
        const rows = ['normal', ...TYPES].map((type) => {
          const sa = C.simulate(a, type),
            sb = C.simulate(b, type);
          const d = C.deltaE(C.oklab(sa), C.oklab(sb)) * 100;
          const cls = d < 6 ? 'bad' : d < 12 ? 'warn' : 'ok';
          const verdict = t(d < 6 ? 'v_bad' : d < 12 ? 'v_meh' : 'v_ok');
          const col = cls === 'ok' ? 'var(--ok)' : cls === 'warn' ? 'var(--warn)' : 'var(--bad)';
          return `<div class="pair-row"><span>${esc(t('n_' + type))}</span>
            <span class="two"><span style="background:${C.rgbToHex(sa)}"></span><span style="background:${C.rgbToHex(sb)}"></span></span>
            <span><span class="pill ${cls}">${esc(verdict)}</span> <span class="mono muted" style="font-size:.72rem">ΔE ${d.toFixed(1)}</span>
            <div class="bar"><span style="width:${Math.min(100, (d / 30) * 100)}%;background:${col}"></span></div></span></div>`;
        });
        const names = `<div class="nrow" style="margin-bottom:8px"><span class="k">A</span><span><span class="dot" style="background:${C.rgbToHex(a)}"></span>${esc(C.describe(a, TV.lang))}</span></div>
          <div class="nrow" style="margin-bottom:10px"><span class="k">B</span><span><span class="dot" style="background:${C.rgbToHex(b)}"></span>${esc(C.describe(b, TV.lang))}</span></div>`;
        $('#pairOut').innerHTML = names + rows.join('');
      }
      [['pa', 'paHex'], ['pb', 'pbHex']].forEach(([pick, text]) => {
        $('#' + pick).addEventListener('input', (e) => {
          $('#' + text).value = e.target.value;
          renderPair();
        });
        $('#' + text).addEventListener('input', (e) => {
          const c = C.hexToRgb(e.target.value);
          if (c) $('#' + pick).value = C.rgbToHex(c);
          renderPair();
        });
      });
      $('#pairSwap').addEventListener('click', () => {
        const a = $('#paHex').value;
        $('#paHex').value = $('#pa').value = $('#pbHex').value;
        $('#pbHex').value = $('#pb').value = a;
        renderPair();
      });
      function renderPresets() {
        const box = $('#pairPresets');
        box.innerHTML = `<span class="mono muted" style="font-size:.72rem">${esc(t('presets'))}</span>`;
        PAIRS.forEach(([x, y]) => {
          const b = document.createElement('button');
          b.className = 'btn sm';
          b.innerHTML = `<span class="dot" style="background:${x};margin:0"></span><span class="dot" style="background:${y};margin:0"></span>`;
          b.title = `${C.describe(C.hexToRgb(x), TV.lang)} / ${C.describe(C.hexToRgb(y), TV.lang)}`;
          b.addEventListener('click', () => {
            $('#pa').value = $('#paHex').value = x;
            $('#pb').value = $('#pbHex').value = y;
            renderPair();
          });
          box.appendChild(b);
        });
      }
      // #endregion

      // #region Tab-Erklärung
      const TAB_ICONS = { identify: '◎', test: '◈', simulate: '◐', enhance: '✦', pair: '⇄' };
      function renderTabInfo() {
        $('#tabIco').textContent = TAB_ICONS[mode];
        $('#tabText').innerHTML = t('info_' + mode);
      }
      // #endregion

      // #region Sehtest
      // Eigene Symbole statt Ziffern (Pfade im 100×100-Raster, bewusst kräftig,
      // damit sie aus Punkten gut erkennbar sind)
      const ICONS = {
        star: 'M50 4 L62 36 L96 37 L69 58 L79 92 L50 72 L21 92 L31 58 L4 37 L38 36 Z',
        heart: 'M50 90 C20 68 5 52 5 32 C5 16 17 6 31 6 C40 6 46 11 50 19 C54 11 60 6 69 6 C83 6 95 16 95 32 C95 52 80 68 50 90 Z',
        moon: 'M66 4 C38 8 16 30 16 55 C16 79 36 97 61 97 C77 97 90 89 97 77 C89 81 80 83 72 83 C49 83 33 66 33 44 C33 27 46 11 66 4 Z',
        bolt: 'M60 2 L16 58 L46 58 L37 98 L86 38 L56 38 L66 2 Z',
        house: 'M50 6 L96 46 L83 46 L83 94 L60 94 L60 66 L40 66 L40 94 L17 94 L17 46 L4 46 Z',
        fish: 'M4 50 C22 20 58 16 76 40 L97 22 L97 78 L76 60 C58 84 22 80 4 50 Z',
        drop: 'M50 4 C65 30 84 48 84 65 C84 84 69 96 50 96 C31 96 16 84 16 65 C16 48 35 30 50 4 Z',
        arrow: 'M4 36 L50 36 L50 10 L96 50 L50 90 L50 64 L4 64 Z',
      };
      const iconSvg = (k) => `<svg viewBox="0 0 100 100" aria-hidden="true"><path d="${ICONS[k]}" fill="currentColor"/></svg>`;

      // Farbpaare (Figur / Hintergrund), rechnerisch mit TVColor.simulate gesucht:
      // für normales Sehen ΔE ≈ 15, für die Ziel-Farbschwäche ΔE < 3, gleiche Helligkeit
      const PLATES = [
        { cat: 'control', fg: '#e8962c', bg: '#4f6688' },
        { cat: 'rg', fg: '#d7735a', bg: '#8f9a52' },
        { cat: 'rg', fg: '#00af46', bg: '#a59a5c' },
        { cat: 'protan', fg: '#ff7d4b', bg: '#a3925e' },
        { cat: 'deutan', fg: '#dc5a55', bg: '#a3925e' },
        { cat: 'tritan', fg: '#87a550', bg: '#9a9ab8' },
        { cat: 'rg', fg: '#c86e64', bg: '#7d9668' },
        { cat: 'blank', fg: '#a59a5c', bg: '#a59a5c' },
        { cat: 'protan', fg: '#dc7da0', bg: '#7c8aa6' },
        { cat: 'deutan', fg: '#d246a5', bg: '#9a86a8' },
        { cat: 'rg', fg: '#00a555', bg: '#b49a6a' },
        { cat: 'tritan', fg: '#b98cd2', bg: '#b0a07a' },
      ];

      function rand(a, b) {
        return a + Math.random() * (b - a);
      }
      // Punktfeld wie bei Ishihara-Tafeln; Helligkeit jedes Punkts leicht variiert,
      // damit man die Figur nicht über hell/dunkel erkennt
      function drawPlate(canvas, plate, icon) {
        const S = canvas.width;
        const g = canvas.getContext('2d');
        g.clearRect(0, 0, S, S);
        const R = S / 2 - 6;
        const path = new Path2D(ICONS[icon]);
        const probe = document.createElement('canvas').getContext('2d');
        const scale = (S * 0.56) / 100;
        const off = (S - 100 * scale) / 2;
        const inFigure = (x, y) => plate.cat !== 'blank' && probe.isPointInPath(path, (x - off) / scale, (y - off) / scale);
        const fg = C.oklab(C.hexToRgb(plate.fg)),
          bg = C.oklab(C.hexToRgb(plate.bg));
        const dots = [];
        const cell = 24;
        const grid = new Map();
        const key = (x, y) => ((x / cell) | 0) + ',' + ((y / cell) | 0);
        for (let i = 0; i < 9000 && dots.length < 1500; i++) {
          const r = rand(5, 15);
          const a = Math.random() * Math.PI * 2;
          const d = Math.sqrt(Math.random()) * (R - r);
          const x = S / 2 + Math.cos(a) * d,
            y = S / 2 + Math.sin(a) * d;
          let ok = true;
          const cx = (x / cell) | 0,
            cy = (y / cell) | 0;
          for (let gx = cx - 1; gx <= cx + 1 && ok; gx++)
            for (let gy = cy - 1; gy <= cy + 1 && ok; gy++)
              for (const o of grid.get(gx + ',' + gy) || []) if (Math.hypot(o.x - x, o.y - y) < o.r + r + 2.5) ok = false;
          if (!ok) continue;
          const dot = { x, y, r };
          dots.push(dot);
          const k = key(x, y);
          if (!grid.has(k)) grid.set(k, []);
          grid.get(k).push(dot);
        }
        g.fillStyle = '#f4efe6';
        g.beginPath();
        g.arc(S / 2, S / 2, S / 2 - 2, 0, Math.PI * 2);
        g.fill();
        dots.forEach((d) => {
          const base = inFigure(d.x, d.y) ? fg : bg;
          const c = C.oklabToRgb({ L: base.L + rand(-0.05, 0.05), a: base.a * rand(0.85, 1.12), b: base.b * rand(0.85, 1.12) });
          g.fillStyle = C.rgbToHex(c);
          g.beginPath();
          g.arc(d.x, d.y, d.r, 0, Math.PI * 2);
          g.fill();
        });
      }

      let testState = null;
      function shuffleArr(a) {
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }
      function startTest() {
        const keys = Object.keys(ICONS);
        // Symbole verteilen, möglichst ohne direkte Wiederholung
        let last = null;
        const plates = PLATES.map((p) => {
          let icon;
          do icon = keys[Math.floor(Math.random() * keys.length)];
          while (icon === last);
          last = icon;
          return { ...p, icon: p.cat === 'blank' ? null : icon };
        });
        testState = { plates, i: 0, answers: [] };
        $('#testIntro').hidden = true;
        $('#testResult').hidden = true;
        $('#testRun').hidden = false;
        showPlate();
      }
      function showPlate() {
        const st = testState;
        const p = st.plates[st.i];
        drawPlate($('#plate'), p, p.icon || 'star');
        p.img = $('#plate').toDataURL('image/jpeg', 0.6);
        $('#plateNum').textContent = t('plateOf', st.i + 1, st.plates.length);
        $('#testBar').style.width = (st.i / st.plates.length) * 100 + '%';
        // 7 Symbole zur Auswahl (inkl. richtigem) + "nichts"
        const keys = Object.keys(ICONS);
        const opts = shuffleArr(keys.filter((k) => k !== p.icon)).slice(0, p.icon ? 6 : 7);
        if (p.icon) opts.push(p.icon);
        const box = $('#choices');
        box.innerHTML = '';
        shuffleArr(opts).forEach((k) => {
          const b = document.createElement('button');
          b.className = 'choice';
          b.innerHTML = iconSvg(k);
          b.title = k;
          b.addEventListener('click', () => answer(k));
          box.appendChild(b);
        });
        const none = document.createElement('button');
        none.className = 'choice none';
        none.textContent = t('nothing');
        none.addEventListener('click', () => answer(null));
        box.appendChild(none);
      }
      function answer(k) {
        const st = testState;
        st.answers.push(k);
        st.i++;
        if (st.i < st.plates.length) showPlate();
        else showResult();
      }
      function evaluate() {
        const st = testState;
        const sc = {};
        st.plates.forEach((p, i) => {
          sc[p.cat] = sc[p.cat] || { ok: 0, n: 0 };
          sc[p.cat].n++;
          if (st.answers[i] === p.icon) sc[p.cat].ok++;
        });
        const miss = (c) => (sc[c] ? sc[c].n - sc[c].ok : 0);
        let verdict;
        if (miss('control')) verdict = { key: 'invalid', icon: '⚠' };
        else {
          const rg = miss('rg'),
            pm = miss('protan'),
            dm = miss('deutan'),
            tm = miss('tritan');
          if (rg >= 2 || pm + dm >= 2) {
            const strong = rg >= 3 && Math.max(pm, dm) >= 2;
            const type = pm > dm ? 'protan' : dm > pm ? 'deutan' : 'rg';
            verdict = { key: type, icon: type === 'protan' ? '🔴' : type === 'deutan' ? '🟢' : '◐', sev: strong ? 'strong' : 'mild', sim: type === 'rg' ? 'deutan' : type };
          } else if (tm >= 2) {
            verdict = { key: 'tritan', icon: '🔵', sev: 'mild', sim: 'tritan' };
          } else verdict = { key: 'normal', icon: '✓' };
        }
        return { sc, verdict };
      }
      function showResult() {
        $('#testBar').style.width = '100%';
        $('#testRun').hidden = true;
        $('#testResult').hidden = false;
        renderResult();
      }
      function renderResult() {
        if (!testState || $('#testResult').hidden) return;
        const { sc, verdict } = evaluate();
        const v = verdict;
        let text = '';
        if (v.key === 'normal') text = t('r_normalText');
        else if (v.key === 'invalid') text = t('r_invalidText');
        else if (v.key === 'tritan') text = t('r_tritanText');
        else text = (v.key === 'rg' ? t('r_rgText') + ' ' : '') + t('r_typeText', t(v.sev === 'strong' ? 'r_strong' : 'r_mild'));
        $('#verdict').innerHTML = `<span class="big">${v.icon}</span><div><h3>${esc(t('r_' + v.key))}</h3><p>${esc(text)}</p></div>`;
        $('#scores').innerHTML = ['control', 'rg', 'protan', 'deutan', 'tritan', 'blank']
          .filter((c) => sc[c])
          .map((c) => {
            const { ok, n } = sc[c];
            const cls = ok === n ? 'ok' : ok === 0 ? 'bad' : 'warn';
            return `<div class="score"><div class="n" style="color:var(--${cls})">${ok}/${n}</div><div class="muted">${esc(t('sc_' + c))}</div></div>`;
          })
          .join('');
        const acts = $('#resultActions');
        acts.innerHTML = '';
        if (v.sim) {
          const b1 = document.createElement('button');
          b1.className = 'btn primary';
          b1.textContent = t('toSim');
          b1.addEventListener('click', () => {
            simType = v.sim;
            renderControls();
            setMode('simulate');
            if (!hasImage) $('#sample').click();
          });
          const b2 = document.createElement('button');
          b2.className = 'btn';
          b2.textContent = t('toEnhance');
          b2.addEventListener('click', () => {
            enhType = v.sim === 'achroma' ? 'deutan' : v.sim;
            renderControls();
            setMode('enhance');
            if (!hasImage) $('#sample').click();
          });
          acts.append(b1, b2);
        }
        $('#review').innerHTML = testState.plates
          .map((p, i) => {
            const a = testState.answers[i];
            const ok = a === p.icon;
            const show = (k) => (k ? iconSvg(k) : '<span>∅</span>');
            return `<figure><img src="${p.img}" alt=""><div class="ans" style="color:var(--${ok ? 'ok' : 'bad'})">${show(p.icon)}${ok ? '✓' : '✕ ' + show(a)}</div>${esc(t('sc_' + p.cat))}</figure>`;
          })
          .join('');
      }
      // Nur die Beschriftungen der laufenden Tafel neu setzen (Tafel nicht neu würfeln)
      function showPlateChoicesLang() {
        $('#plateNum').textContent = t('plateOf', testState.i + 1, testState.plates.length);
        const none = $('#choices .none');
        if (none) none.textContent = t('nothing');
      }
      $('#testStart').addEventListener('click', startTest);
      $('#testAgain').addEventListener('click', startTest);
      // #endregion

      // #region Modus
      function setMode(m) {
        mode = m;
        $$('#modeTabs [data-mode]').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.mode === m)));
        $('#view-image').hidden = m === 'pair' || m === 'test';
        $('#view-pair').hidden = m !== 'pair';
        $('#view-test').hidden = m !== 'test';
        $$('[data-for]').forEach((el) => (el.hidden = el.dataset.for !== m));
        if (m === 'pair' || m === 'test') stopCam();
        renderTabInfo();
        render();
        try {
          history.replaceState(null, '', '#' + m);
        } catch (e) {}
      }
      $$('#modeTabs [data-mode]').forEach((b) => b.addEventListener('click', () => setMode(b.dataset.mode)));
      // #endregion

      TV.init({
        glyph: '◐',
        strings: STRINGS,
        onLang: () => {
          renderTabInfo();
          renderResult();
          if (testState && !$('#testRun').hidden) showPlateChoicesLang();
          renderControls();
          renderPresets();
          renderPair();
          renderHistory();
          updateCamButtons();
          if (current) showColor(current);
          if (hasImage) render();
        },
      });
      C.loadNames().then(() => current && showColor(current)).catch(() => {});
      drawPlate($('#demoPlate'), PLATES[0], 'heart');
      // Link-Format: #pair&a=313080&b=7f8030 (z. B. vom Farb-Konverter)
      const [startMode, ...params] = location.hash.slice(1).split('&');
      const hp = new URLSearchParams(params.join('&'));
      [['a', 'pa', 'paHex'], ['b', 'pb', 'pbHex']].forEach(([k, pick, text]) => {
        const c = C.hexToRgb(hp.get(k) || '');
        if (c) $('#' + pick).value = $('#' + text).value = C.rgbToHex(c);
      });
      renderPair();
      setMode(['identify', 'simulate', 'enhance', 'pair', 'test'].includes(startMode) ? startMode : 'identify');
    </script>
  </body>
</html>
